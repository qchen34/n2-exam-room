const BANK_N2_2026=[{"id":"N2S2607-01","lv":"N2","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「濃い」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"祖父は濃い味のものを好む。","tr":"祖父喜欢味道浓的东西。","opts":["からい","うすい","あまい","こい"],"ans":3,"exp":"正解は「こい」。「濃い」＝味道浓、颜色深。「辛い」は辣、「薄い」は淡、「甘い」は甜，都与「味」的程度方向不同。","notes":[{"t":"祖父","r":"そふ","m":"祖父"},{"t":"濃い","r":"こい","m":"浓的"},{"t":"好む","r":"このむ","m":"喜好"}]},{"id":"N2S2607-02","lv":"N2","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「競技」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"次の競技に出場する人は、あちらに集まってください。","tr":"参加下一个项目的人，请到那边集合。","opts":["きょうぎ","きゅうぎ","きょうじ","きゅうじ"],"ans":0,"exp":"正解は「きょうぎ」。「競技」＝比赛项目。其余三项是没有的词，用「競」的音读「きょう」＋「技」的「ぎ」即可判断。","notes":[{"t":"競技","r":"きょうぎ","m":"比赛项目"},{"t":"出場","r":"しゅつじょう","m":"出场、参赛"},{"t":"集まって","r":"あつまって","m":"集合"}]},{"id":"N2S2607-03","lv":"N2","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「消毒」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"傷口を洗ったら、この薬で消毒してください。","tr":"洗过伤口之后，请用这个药消毒。","opts":["しょうどく","しょうとく","しょどく","しょとく"],"ans":0,"exp":"正解は「しょうどく」。「消毒」＝杀菌。注意「所得（しょとく）」是收入，字形相近但读音不同。","notes":[{"t":"傷口","r":"きずぐち","m":"伤口"},{"t":"消毒","r":"しょうどく","m":"消毒"},{"t":"薬","r":"くすり","m":"药"}]},{"id":"N2S2607-04","lv":"N2","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「構わない」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"彼のことは、もう構わないことにした。","tr":"他的事，我决定不再管了。","opts":["かばわない","かまわない","きらわない","さそわない"],"ans":1,"exp":"正解は「かまわない」。「構う」＝在意、理会；「構わない」＝不介意、不管。「庇う（かばう）」是庇护，「嫌う（きらう）」是讨厌，「誘う（さそう）」是邀请。","notes":[{"t":"構わない","r":"かまわない","m":"不介意、不管"},{"t":"庇う","r":"かばう","m":"庇护"},{"t":"嫌う","r":"きらう","m":"讨厌"}]},{"id":"N2S2607-05","lv":"N2","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「知人」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"鈴木さんは、父の古くからの知人です。","tr":"铃木先生是父亲的老相识。","opts":["ちにん","しじん","ちじん","しにん"],"ans":2,"exp":"正解は「ちじん」。「知人」＝熟人、相识。「詩人（しじん）」是诗人，「死人（しにん）」是死者，读音相近要注意区分。","notes":[{"t":"知人","r":"ちじん","m":"熟人"},{"t":"古くから","r":"ふるくから","m":"从很早以前"},{"t":"詩人","r":"しじん","m":"诗人"}]},{"id":"N2S2607-06","lv":"N2","cat":"語彙","tags":["表記","2026-07"],"q":"「すいみん」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"十分なすいみんを確保する。","tr":"确保充足的睡眠。","opts":["垂眼","垂眠","睡眼","睡眠"],"ans":3,"exp":"正解は「睡眠」。「睡」＝睡，「眠」＝眠。其余三项都是把偏旁拼错的假汉字。","notes":[{"t":"睡眠","r":"すいみん","m":"睡眠"},{"t":"確保","r":"かくほ","m":"确保"},{"t":"十分","r":"じゅうぶん","m":"充足"}]},{"id":"N2S2607-07","lv":"N2","cat":"語彙","tags":["表記","2026-07"],"q":"「しげん」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"未来のために、しげんを大切にしよう。","tr":"为了未来，要珍惜资源。","opts":["資源","自然","資然","自源"],"ans":0,"exp":"正解は「資源」。「資」＝资，「源」＝来源；「自然（しぜん）」是自然，读音也不同。","notes":[{"t":"資源","r":"しげん","m":"资源"},{"t":"未来","r":"みらい","m":"未来"},{"t":"大切","r":"たいせつ","m":"重要"}]},{"id":"N2S2607-08","lv":"N2","cat":"語彙","tags":["表記","2026-07"],"q":"「おぎなう」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"野菜ジュースを飲んで栄養をおぎなう。","tr":"喝蔬菜汁来补充营养。","opts":["哺う","捕う","補う","浦う"],"ans":2,"exp":"正解は「補う」＝补足、弥补。「捕う」「哺う」「浦う」都不成词，只有「補」有补充之意。","notes":[{"t":"補う","r":"おぎなう","m":"补充"},{"t":"栄養","r":"えいよう","m":"营养"},{"t":"野菜","r":"やさい","m":"蔬菜"}]},{"id":"N2S2607-09","lv":"N2","cat":"語彙","tags":["表記","2026-07"],"q":"「せっきょう」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"親戚のおじさんにせっきょうされた。","tr":"被亲戚家的叔叔训了一顿。","opts":["説教","説強","節教","節強"],"ans":0,"exp":"正解は「説教」＝说教、训诫。「説」＝说，「教」＝教导，后三项是把字拼错的假词。","notes":[{"t":"説教","r":"せっきょう","m":"说教、训诫"},{"t":"親戚","r":"しんせき","m":"亲戚"},{"t":"おじさん","r":"おじさん","m":"叔叔"}]},{"id":"N2S2607-10","lv":"N2","cat":"語彙","tags":["表記","2026-07"],"q":"「あざやかな」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"佐藤さんはあざやかな色のシャツを着ていた。","tr":"佐藤穿着一件颜色鲜艳的衬衫。","opts":["明やか","鮮やか","照やか","清やか"],"ans":1,"exp":"正解は「鮮やか」＝鲜艳、鲜明。「鮮」有鲜明之意，其余为错误拼写。","notes":[{"t":"鮮やか","r":"あざやか","m":"鲜艳"},{"t":"色","r":"いろ","m":"颜色"},{"t":"着て","r":"きて","m":"穿着"}]},{"id":"N2S2607-11","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"（　）グループから代表者1名を選出してください。","tr":"请从每个小组中选出一名代表。","opts":["部","毎","個","各"],"ans":3,"exp":"正解は「各」。「各グループ」＝每个小组，表示逐一。汉语的「每」在日语里不能说「毎グループ」（「毎」只接「毎日・毎回」等固定词）。","notes":[{"t":"各","r":"かく","m":"各个"},{"t":"代表者","r":"だいひょうしゃ","m":"代表"},{"t":"選出","r":"せんしゅつ","m":"选出"}]},{"id":"N2S2607-12","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"私の国は大統領（　）を採用している。","tr":"我的国家采用总统制。","opts":["法","制","則","律"],"ans":1,"exp":"正解は「制」。「大統領制」＝总统制，指一种制度。「法」是法律，「則」是规则，「律」多用于「律令・法律」的复合词。","notes":[{"t":"大統領","r":"だいとうりょう","m":"总统"},{"t":"制度","r":"せいど","m":"制度"},{"t":"採用","r":"さいよう","m":"采用"}]},{"id":"N2S2607-13","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"卵（　）のきれいな石を見つけました。","tr":"找到了一块鸡蛋大小、很漂亮的石头。","opts":["感","同","大","近"],"ans":2,"exp":"正解は「大」。「卵大」＝鸡蛋大小，表示尺寸。日语常用「〜大」表示大小（例：拳大、豆大）。","notes":[{"t":"卵","r":"たまご","m":"鸡蛋"},{"t":"卵大","r":"たまごだい","m":"鸡蛋大小"},{"t":"石","r":"いし","m":"石头"}]},{"id":"N2S2607-14","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"明日の天気によって、イベントを行うかどうか（　）する予定です。","tr":"打算根据明天的天气，判断活动是否举行。","opts":["判断","確信","特定","評価"],"ans":0,"exp":"正解は「判断」。「〜かどうかを判断する」＝判断是否…。「確信」是确信，「特定」是确定身份，「評価」是评价，都不能与「かどうか」搭配。","notes":[{"t":"判断","r":"はんだん","m":"判断"},{"t":"天気","r":"てんき","m":"天气"},{"t":"予定","r":"よてい","m":"预定、打算"}]},{"id":"N2S2607-15","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"山本氏は、今は作家として有名だが、（　）は俳優をしていたのだそうだ。","tr":"山本现在作为作家很有名，但听说原本是当演员的。","opts":["もともと","生まれつき","先ほど","あらかじめ"],"ans":0,"exp":"正解は「もともと」＝原本、本来。「生まれつき」是天生，「先ほど」是刚才，「あらかじめ」是预先，都与「以前做过演员」的语义不合。","notes":[{"t":"作家","r":"さっか","m":"作家"},{"t":"俳優","r":"はいゆう","m":"演员"},{"t":"もともと","r":"もともと","m":"原本"}]},{"id":"N2S2607-16","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"会議に参加するメンバーの都合を聞いて、日程の（　）を行った。","tr":"问了参会成员的方便时间后，对日程做了调整。","opts":["改定","整備","改正","調整"],"ans":3,"exp":"正解は「調整」。「日程の調整」＝调整日程。「改定・改正」用于规则、条款、价格；「整備」用于设备、环境。","notes":[{"t":"都合","r":"つごう","m":"方便、情况"},{"t":"日程","r":"にってい","m":"日程"},{"t":"調整","r":"ちょうせい","m":"调整"}]},{"id":"N2S2607-17","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"お金をかけて開発した商品が売れず、A社は今年、大きな（　）を出した。","tr":"花大钱开发的商品卖不出去，A公司今年出现了巨额赤字。","opts":["不良","赤字","消失","欠点"],"ans":1,"exp":"正解は「赤字」。「赤字を出す」＝出现赤字，是固定搭配。「不良」指次品，「消失」是消失，「欠点」是缺点，都不能与「出す」搭配。","notes":[{"t":"赤字","r":"あかじ","m":"赤字"},{"t":"開発","r":"かいはつ","m":"开发"},{"t":"商品","r":"しょうひん","m":"商品"}]},{"id":"N2S2607-18","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"中村さんは（　）性格だから、そういう細かいことは気にしないだろう。","tr":"中村性格大大咧咧，这种细节他大概不会在意。","opts":["なまいきな","おおざっぱな","わがままな","いじわるな"],"ans":1,"exp":"正解は「おおざっぱな」＝粗枝大叶，与后文「細かいことを気にしない」呼应。「なまいき」是傲慢，「わがまま」是任性，「いじわる」是坏心眼。","notes":[{"t":"性格","r":"せいかく","m":"性格"},{"t":"おおざっぱ","r":"おおざっぱ","m":"粗枝大叶"},{"t":"細かい","r":"こまかい","m":"细小的"}]},{"id":"N2S2607-19","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"彼は今までどんな苦労にも負けずに、一人で（　）生きてきた。","tr":"他至今不向任何辛苦低头，一个人坚强地活了过来。","opts":["いちじるしく","痛ましく","たくましく","恐ろしく"],"ans":2,"exp":"正解は「たくましく」＝坚强、健壮。「いちじるしく」是显著地，「痛ましく」是令人心痛地，「恐ろしく」是可怕地，都不修饰「生きてきた」。","notes":[{"t":"苦労","r":"くろう","m":"辛苦"},{"t":"負けず","r":"まけず","m":"不输、不屈服"},{"t":"たくましい","r":"たくましい","m":"坚强的"}]},{"id":"N2S2607-20","lv":"N2","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"仕事の話をしていたのに、いつのまにか話が（　）、家族の話をしていた。","tr":"本来在谈工作，不知不觉话题跑偏，聊起了家里的事。","opts":["反して","狂って","それて","偏って"],"ans":2,"exp":"正解は「それて」。「話がそれる」＝话题跑偏，是固定表达。「反して」是相反，「狂って」是发狂，「偏って」是偏颇。","notes":[{"t":"いつのまにか","r":"いつのまにか","m":"不知不觉"},{"t":"それる","r":"それる","m":"偏离"},{"t":"家族","r":"かぞく","m":"家人"}]},{"id":"N2S2607-21","lv":"N2","cat":"語彙","tags":["類義","2026-07"],"q":"「問い合わせた」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"質問があったので、メーカーに問い合わせた。","tr":"因为有问题，所以向厂商咨询了。","opts":["製品を輸入した会社","製品を売った店","製品を修理した店","製品を作った会社"],"ans":3,"exp":"正解は「製品を作った会社」。「メーカー」＝制造商，就是生产产品的公司。其余是进口商、销售店、修理店。","notes":[{"t":"問い合わせる","r":"といあわせる","m":"咨询"},{"t":"メーカー","r":"めーかー","m":"制造商"},{"t":"製品","r":"せいひん","m":"产品"}]},{"id":"N2S2607-22","lv":"N2","cat":"語彙","tags":["類義","2026-07"],"q":"「はやっている」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"今あなたの国で、はやっているものは何ですか。","tr":"现在在你们国家流行的是什么？","opts":["制限して","増加して","流行して","発展して"],"ans":2,"exp":"正解は「流行して」。「はやる」＝流行する。「制限」是限制，「増加」是增加，「発展」是发展。","notes":[{"t":"はやる","r":"はやる","m":"流行"},{"t":"流行","r":"りゅうこう","m":"流行"},{"t":"増加","r":"ぞうか","m":"增加"}]},{"id":"N2S2607-23","lv":"N2","cat":"語彙","tags":["類義","2026-07"],"q":"「一括して」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"ここでは、商品を一括して管理している。","tr":"这里把商品统一管理。","opts":["細かく分けて","箱に入れて","しばらくの間","全部いっしょに"],"ans":3,"exp":"正解は「全部いっしょに」。「一括」＝一并、一次性全部处理。「細かく分けて」正好相反。","notes":[{"t":"一括","r":"いっかつ","m":"一并、统一"},{"t":"管理","r":"かんり","m":"管理"},{"t":"商品","r":"しょうひん","m":"商品"}]},{"id":"N2S2607-24","lv":"N2","cat":"語彙","tags":["類義","2026-07"],"q":"「思いがけない」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"先週、思いがけない出来事があった。","tr":"上周发生了一件意想不到的事。","opts":["信じられない","予想していなかった","忘れられない","経験したことがない"],"ans":1,"exp":"正解は「予想していなかった」。「思いがけない」＝意想不到、没料到。「忘れられない」是难忘，语义不同。","notes":[{"t":"思いがけない","r":"おもいがけない","m":"意想不到"},{"t":"出来事","r":"できごと","m":"事件"},{"t":"予想","r":"よそう","m":"预想"}]},{"id":"N2S2607-25","lv":"N2","cat":"語彙","tags":["類義","2026-07"],"q":"「いっそう」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"次の目標に向かって、これからいっそう努力しようと思います。","tr":"为了下一个目标，今后要更加努力。","opts":["もっと","できるだけ","しっかり","いつも"],"ans":0,"exp":"正解は「もっと」。「いっそう」＝更加、进一步，表示程度加深。「できるだけ」是尽可能，「しっかり」是好好地，「いつも」是总是。","notes":[{"t":"いっそう","r":"いっそう","m":"更加"},{"t":"目標","r":"もくひょう","m":"目标"},{"t":"努力","r":"どりょく","m":"努力"}]},{"id":"N2S2607-26","lv":"N2","cat":"語彙","tags":["用法","2026-07"],"q":"「要点」の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"（次の文のうち、「要点」を正しく使っているものを選ぶ）","tr":"选出「要点」用得最正确的一句。","opts":["彼は今、成功するかどうかの要点にいる。","人間にとっての要点は、心臓と脳である。","あまり時間がなかったので、計画の要点だけを説明した。","卒業式の日に先生にいただいた言葉は私の要点です。"],"ans":2,"exp":"正解は3。「要点」＝重点、核心内容，只能用于说明内容、论述的要点。1应说「瀬戸際」（关键时刻）；2应说「要」；4应说「宝物／支え」。","notes":[{"t":"要点","r":"ようてん","m":"要点"},{"t":"説明","r":"せつめい","m":"说明"},{"t":"瀬戸際","r":"せとぎわ","m":"关键时刻"}]},{"id":"N2S2607-27","lv":"N2","cat":"語彙","tags":["用法","2026-07"],"q":"「裂ける」の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"（次の文のうち、「裂ける」を正しく使っているものを選ぶ）","tr":"选出「裂ける」用得最正确的一句。","opts":["壁から飛び出していたくぎに引っかかって、スカートが裂けてしまった。","ズボンのポケットに携帯電話を入れていたら、画面が裂けてしまった。","硬い肉を切ろうとして力を入れたら、箸が裂けてしまった。","冷蔵庫を開けたときに卵が落ちて裂けてしまった。"],"ans":0,"exp":"正解は1。「裂ける」用于布、纸、皮等被撕开。屏幕破碎用「割れる」，筷子断用「折れる」，鸡蛋破用「割れる」。","notes":[{"t":"裂ける","r":"さける","m":"撕裂"},{"t":"くぎ","r":"くぎ","m":"钉子"},{"t":"割れる","r":"われる","m":"破碎"}]},{"id":"N2S2607-28","lv":"N2","cat":"語彙","tags":["用法","2026-07"],"q":"「経過」の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"（次の文のうち、「経過」を正しく使っているものを選ぶ）","tr":"选出「経過」用得最正确的一句。","opts":["うっかりして、降りる駅を経過してしまった。","忙しすぎて、季節が経過するのに気づけなかった。","たくさんの失敗を経過して、立派な大人になった。","就職して1年が経過し、新しい生活にも慣れてきた。"],"ans":3,"exp":"正解は4。「経過」＝（时间）经过、流逝，主语是时间。「駅を経過」应说「通過」，「失敗を経過」应说「経験」。","notes":[{"t":"経過","r":"けいか","m":"经过、流逝"},{"t":"就職","r":"しゅうしょく","m":"就业"},{"t":"慣れて","r":"なれて","m":"习惯"}]},{"id":"N2S2607-29","lv":"N2","cat":"語彙","tags":["用法","2026-07"],"q":"「打ち消す」の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"（次の文のうち、「打ち消す」を正しく使っているものを選ぶ）","tr":"选出「打ち消す」用得最正确的一句。","opts":["用事ができて旅行に行けなくなったので、ホテルの予約を打ち消した。","その選手は記者会見で引退のうわさを打ち消した。","答えを書く場所を間違えたので、全部打ち消して書き直した。","仕事内容を見直し、残業を先月より50パーセント打ち消した。"],"ans":1,"exp":"正解は2。「打ち消す」＝否认、消除（传言、说法）。取消预订说「取り消す」，划掉说「消す」，减少说「減らす」。","notes":[{"t":"打ち消す","r":"うちけす","m":"否认、打消"},{"t":"うわさ","r":"うわさ","m":"传闻"},{"t":"取り消す","r":"とりけす","m":"取消"}]},{"id":"N2S2607-30","lv":"N2","cat":"語彙","tags":["用法","2026-07"],"q":"「さっと」の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"（次の文のうち、「さっと」を正しく使っているものを選ぶ）","tr":"选出「さっと」用得最正确的一句。","opts":["東京は電車の数が多いので、乗り遅れても次の電車がさっと来ます。","朝は涼しかったが、昼になるとさっと暑くなって気温が30度を超えた。","刑事がうそを指摘すると、犯人の顔色がさっと変わった。","山口さんに、戻ったらさっと電話をしてほしいと伝えてください。"],"ans":2,"exp":"正解は3。「さっと」＝动作、变化一下子迅速发生，常与「変わる・動く・走る」搭配。表示「马上」用「すぐ」，表示「突然」用「急に」。","notes":[{"t":"刑事","r":"けいじ","m":"刑警"},{"t":"指摘","r":"してき","m":"指出"},{"t":"顔色","r":"かおいろ","m":"脸色"}]},{"id":"N2S2607-31","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"年賀状（　）、新年を祝う言葉を書いて送るはがきや手紙のことだ。","tr":"所谓贺年卡，就是写上新年祝福语寄出的明信片或信件。","opts":["には","とは","としては","によっては"],"ans":1,"exp":"正解は「とは」。「〜とは…のことだ」用于给词语下定义，相当于「所谓…就是…」。「には」表存在场所或对象，「としては」表立场，「によっては」表”取决于…”。","g":"〜とは","gm":"所谓…（下定义、说明词义）","notes":[{"t":"年賀状","r":"ねんがじょう","m":"贺年卡"},{"t":"祝う","r":"いわう","m":"庆祝"},{"t":"はがき","r":"はがき","m":"明信片"}]},{"id":"N2S2607-32","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"父の若いころのアルバムを見た。写真に写る父が（　）私に似ていて、自分の写真かと思ってしまった。","tr":"看了父亲年轻时的相册。照片里的父亲实在太像我了，我还以为是自己的照片。","opts":["つい","ちっとも","それほど","あまりにも"],"ans":3,"exp":"正解は「あまりにも」＝实在太…，强调程度超出常识，后接「似ていて…と思ってしまった」这样的结果。「つい」＝不由得，「ちっとも」须接否定，「それほど」＝那么（程度）。","g":"あまりにも〜","gm":"实在太…（程度过甚）","notes":[{"t":"若いころ","r":"わかいころ","m":"年轻时"},{"t":"写る","r":"うつる","m":"（照片里）映出"},{"t":"似て","r":"にて","m":"像"}]},{"id":"N2S2607-33","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"昨日、きゅうりを炒めて食べてみた。今まできゅうりは生（　）食べたことがなかったが、炒めてもおいしかった。","tr":"昨天试着炒黄瓜吃。以前黄瓜我只生吃过，炒着吃也很好吃。","opts":["でしか","にしか","でばかり","にばかり"],"ans":0,"exp":"正解は「でしか…ない」。「生で」是形容动词「生だ」的で形，接「しか」时表示”只限于生吃”。「にしか」只接名词，「ばかり」不接否定。","g":"〜でしか…ない","gm":"只…（限定＋否定）","notes":[{"t":"きゅうり","r":"きゅうり","m":"黄瓜"},{"t":"炒めて","r":"いためて","m":"炒"},{"t":"生","r":"なま","m":"生的"}]},{"id":"N2S2607-34","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"熱を出してつらそうにしている息子を見て、代われる（　）代わってやりたいと思った。","tr":"看到发烧难受的儿子，如果能代替他，我真想替他受这份罪。","opts":["までは","だけで","ものなら","からには"],"ans":2,"exp":"正解は「ものなら」。「〜ものなら」＝如果能…（假定，多用于难以实现的事，后接意愿）。「からには」表”既然…就…”，「だけで」表”仅仅”。","g":"〜ものなら","gm":"如果能…（假定，多含”若真能…”的语气）","notes":[{"t":"代われる","r":"かわれる","m":"能代替"},{"t":"代わって","r":"かわって","m":"代替"},{"t":"熱を出す","r":"ねつをだす","m":"发烧"}]},{"id":"N2S2607-35","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"（教室で）教師「この授業では、各自が自分で選んだテーマ（　）資料を集めてレポートにまとめます。」","tr":"（教室里）教师：这节课，每个人按照自己选定的主题收集资料，整理成报告。","opts":["に比べて","に際して","に伴って","に沿って"],"ans":3,"exp":"正解は「に沿って」＝按照、沿着（方针、主题、期待）。「に比べて」＝与…相比，「に際して」＝在…之际，「に伴って」＝随着…，都不能表示”依照主题”。","g":"〜に沿って","gm":"按照…、沿着…（方针、主题、期待）","notes":[{"t":"各自","r":"かくじ","m":"各自"},{"t":"資料","r":"しりょう","m":"资料"},{"t":"まとめます","r":"まとめます","m":"整理、归纳"}]},{"id":"N2S2607-36","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"先生に、次の授業までに教科書の30ページまで（　）言われた。","tr":"老师让我在下节课之前把教科书读到第30页。","opts":["読んでくるか","読んでこい","読んでおくように","読んでおきなさい"],"ans":2,"exp":"正解は「読んでおくように」。「〜ように言われた」是间接引用请求、指示的固定形式，要用「ように」。直接命令形「読んでこい」「読んでおきなさい」不能接「言われた」。","g":"〜ように言われた","gm":"被（人）要求…（间接引用指示）","notes":[{"t":"教科書","r":"きょうかしょ","m":"教科书"},{"t":"授業","r":"じゅぎょう","m":"课"},{"t":"言われた","r":"いわれた","m":"被说、被要求"}]},{"id":"N2S2607-37","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"娘は1年前から水泳を習っている。水泳を始めてから体が丈夫に（　）、精神的にも強くなったと思う。","tr":"女儿从1年前开始学游泳。开始游泳后，身体不仅变结实了，精神上也变强了。","opts":["なっただけだとすると","なっただけでなく","しただけだとすると","しただけでなく"],"ans":1,"exp":"正解は「なっただけでなく」。「丈夫だ」是形容动词，要用「丈夫になる」；「〜だけでなく…も」表示”不仅…而且”。","g":"〜だけでなく","gm":"不仅…而且…（递进）","notes":[{"t":"水泳","r":"すいえい","m":"游泳"},{"t":"丈夫","r":"じょうぶ","m":"结实"},{"t":"精神的","r":"せいしんてき","m":"精神上"}]},{"id":"N2S2607-38","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"ボクシングには、背中を攻撃（　）というルールがある。","tr":"拳击有一条规定，不可以攻击背部。","opts":["しきれない","しかねない","しようがない","してはならない"],"ans":3,"exp":"正解は「してはならない」＝不可以…（禁止）。「しきれない」＝做不完，「しかねない」＝有可能…（多含负面），「しようがない」＝没办法","g":"〜てはならない","gm":"不可以…（规则、禁止）","notes":[{"t":"ボクシング","r":"ぼくしんぐ","m":"拳击"},{"t":"背中","r":"せなか","m":"背部"},{"t":"攻撃","r":"こうげき","m":"攻击"}]},{"id":"N2S2607-39","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"（電話で）A「お電話ありがとうございます。さくらホテルでございます。」B「すみません、再来年の予約をしたいんですけど、今できますか。」A「はい、（　）。」","tr":"（电话中）A：感谢来电，这里是樱花酒店。B：不好意思，我想预订后年的房间，现在可以吗？A：好的，可以受理。","opts":["なさいます","差し上げます","承ります","お越しになります"],"ans":2,"exp":"正解は「承ります」。这是谦让语，用于自己一方”接受、承办”对方的请求。「なさいます」「お越しになります」是尊敬语，主语是对方；「差し上げます」是”给（人）”，语境不合。","g":"承る（うけたまわる）","gm":"谦让语：接受、承办、听候","notes":[{"t":"予約","r":"よやく","m":"预约"},{"t":"再来年","r":"さらいねん","m":"后年"},{"t":"承ります","r":"うけたまわります","m":"受理（谦让语）"}]},{"id":"N2S2607-40","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"イメージに合うテーブルがどこにも売っていなくてあきらめかけていたが、あるとき、「ないんだったら自分で（　）んじゃないか」と気づいて、作ることにした。","tr":"一直找不到符合构想的桌子，本来快放弃了，但某天想到”既然没有，那自己做出来不就行了”，就决定动手做。","opts":["作っていてもいい","作ってしまえばいい","作ってあるといい","作ってみるならいい"],"ans":1,"exp":"正解は「作ってしまえばいい」。「〜てしまえばいい」＝干脆…不就行了，用于提出简单明快的解决办法。「〜ていてもいい」表许可，「〜てある」表状态存续。","g":"〜てしまえばいい","gm":"干脆…就好了（提出解决办法）","notes":[{"t":"あきらめる","r":"あきらめる","m":"放弃"},{"t":"気づいて","r":"きづいて","m":"意识到"},{"t":"テーブル","r":"てーぶる","m":"桌子"}]},{"id":"N2S2607-41","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"私は、本を読んでいて気になることがあると（　）。だから、1冊読み終わるのにどうしても時間がかかる。","tr":"我读书时一有在意的地方，就忍不住去查。所以读完一本总要花很多时间。","opts":["調べずにはいられない","調べないに違いない","調べそうにない","調べても始まらない"],"ans":0,"exp":"正解は「調べずにはいられない」＝忍不住要查。「〜ずにはいられない」表示情感、冲动无法抑制。「に違いない」是推测，「そうにない」是”看样子不会”。","g":"〜ずにはいられない","gm":"忍不住…、不能不…","notes":[{"t":"気になる","r":"きになる","m":"在意"},{"t":"調べる","r":"しらべる","m":"查"},{"t":"1冊","r":"いっさつ","m":"一本"}]},{"id":"N2S2607-42","lv":"N2","cat":"文法","tags":["文法","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"A「キャッシュカードの暗証番号を忘れちゃったんだけど、銀行に電話して聞けばわかるよね。」B「え、そんな大事な情報、忘れちゃったの？電話で聞いても絶対（　）よ。」","tr":"A：我忘了银行卡密码，打电话问银行就能知道吧？B：哎，这么重要的信息你忘了？就算打电话，银行也绝不可能告诉你。","opts":["教えてくれるはずがない","教えてもらうはずがない","教えてくれたことがない","教えてもらったことがない"],"ans":0,"exp":"正解は「教えてくれるはずがない」。「〜はずがない」＝不可能…。这里主语是银行，用「教えてくれる」（（对方）告诉我）最自然；「〜たことがない」是经验，与”绝不可能”的推断不符。","g":"〜はずがない","gm":"不可能…（强烈否定推测）","notes":[{"t":"暗証番号","r":"あんしょうばんごう","m":"密码"},{"t":"情報","r":"じょうほう","m":"信息"},{"t":"絶対","r":"ぜったい","m":"绝对"}]},{"id":"N2S2607-48","lv":"N2","cat":"文法","tags":["文章の文法","2026-07"],"q":"48に入る最もよいものを、1・2・3・4から一つ選びなさい。","p":["「ビジネス書」と聞くと、難しい言葉が並んだ分厚い本を思い浮かべる人は多いのではないだろうか。しかし、最近は漫画で書かれたビジネス書も増えている。（48）研究によると、文章だけの本より漫画の本のほうが、内容を覚えている割合が高いそうだ。","漫画には、登場人物の会話や動きが描かれている。文章を読むだけでは想像しにくい場面も、漫画なら一目で理解できる。そのため、内容が頭に残りやすいのだと考えられている。（49）、漢字は、覚えようと意識して何度も書くほうが、読むだけより覚えやすい。手を動かすことで記憶が強くなるからだ（50）、漫画で内容を覚えやすいのと同じ理由だ。つまり、体を動かしたり、絵を見たりして覚えることは、記憶に残りやすいということだ。","以上の点から、漫画のビジネス書は、ビジネスの知識を初めて学ぶ人にとって、効果的な学習方法だと言える。入門者にとって、わかりやすさは魅力だ。漫画形式のビジネス書をまだ読んだことがない人、難しそうでなかなか勉強が始められない分野があるという人は、一度読んでみてはいかがだろうか。新しい学びの体験と（51）。"],"tr":"一听到”商业书”，很多人脑海中浮现的应该是堆满难懂词汇的厚书吧。但最近用漫画写的商业书也在增加。据某项研究，漫画书比纯文字书记住内容的比率更高。漫画里画出了人物的对话和动作，只读文字难以想象的场面，看漫画一眼就能理解，因此内容更容易留在脑中。另一方面，汉字则是意识到要记、反复书写比只读更容易记住。亲手写能让记忆变强，这与漫画容易记住内容是同一个道理。也就是说，动手、看图来记的东西更容易留在记忆里。\n从以上几点可以说，漫画商业书对初次学习商业知识的人是有效的学习方法。对入门者来说，易懂就是魅力。还没读过漫画形式商业书的人、有某个领域看起来很难迟迟无法开始学的人，不妨读一次看看。它应该会成为一次新的学习体验。","qt":"下列四个选项中，哪个最适合填入空缺处？","opts":["この","その","ある","以下の"],"ans":2,"exp":"正解は「ある」。「ある研究によると」＝据某项研究，是引出不特定来源的固定说法。「この」指前文刚提的内容（此处研究尚未出现），「その」也需前文已有指代对象，「以下の」用于列举后文内容。","notes":[{"t":"分厚い","r":"ぶあつい","m":"厚的"},{"t":"割合","r":"わりあい","m":"比例"},{"t":"登場人物","r":"とうじょうじんぶつ","m":"登场人物"}]},{"id":"N2S2607-49","lv":"N2","cat":"文法","tags":["文章の文法","2026-07"],"q":"49に入る最もよいものを、1・2・3・4から一つ選びなさい。","p":["「ビジネス書」と聞くと、難しい言葉が並んだ分厚い本を思い浮かべる人は多いのではないだろうか。しかし、最近は漫画で書かれたビジネス書も増えている。（48）研究によると、文章だけの本より漫画の本のほうが、内容を覚えている割合が高いそうだ。","漫画には、登場人物の会話や動きが描かれている。文章を読むだけでは想像しにくい場面も、漫画なら一目で理解できる。そのため、内容が頭に残りやすいのだと考えられている。（49）、漢字は、覚えようと意識して何度も書くほうが、読むだけより覚えやすい。手を動かすことで記憶が強くなるからだ（50）、漫画で内容を覚えやすいのと同じ理由だ。つまり、体を動かしたり、絵を見たりして覚えることは、記憶に残りやすいということだ。","以上の点から、漫画のビジネス書は、ビジネスの知識を初めて学ぶ人にとって、効果的な学習方法だと言える。入門者にとって、わかりやすさは魅力だ。漫画形式のビジネス書をまだ読んだことがない人、難しそうでなかなか勉強が始められない分野があるという人は、一度読んでみてはいかがだろうか。新しい学びの体験と（51）。"],"tr":"（同前一篇：漫画商业书与”动手记忆”的关系）","qt":"下列四个选项中，哪个最适合填入空缺处？","opts":["一方","あるいは","要するに","ただし"],"ans":1,"exp":"正解は「一方」＝另一方面，用于并列对照前一段”漫画易记”与后文”汉字靠手写更易记”。「要するに」是总结，「ただし」是补充限制条件，都与此处的对照关系不符。","notes":[{"t":"一方","r":"いっぽう","m":"另一方面"},{"t":"要するに","r":"ようするに","m":"总之"},{"t":"ただし","r":"ただし","m":"不过"}]},{"id":"N2S2607-50","lv":"N2","cat":"文法","tags":["文章の文法","2026-07"],"q":"50に入る最もよいものを、1・2・3・4から一つ選びなさい。","p":["「ビジネス書」と聞くと、難しい言葉が並んだ分厚い本を思い浮かべる人は多いのではないだろうか。しかし、最近は漫画で書かれたビジネス書も増えている。（48）研究によると、文章だけの本より漫画の本のほうが、内容を覚えている割合が高いそうだ。","漫画には、登場人物の会話や動きが描かれている。文章を読むだけでは想像しにくい場面も、漫画なら一目で理解できる。そのため、内容が頭に残りやすいのだと考えられている。（49）、漢字は、覚えようと意識して何度も書くほうが、読むだけより覚えやすい。手を動かすことで記憶が強くなるからだ（50）、漫画で内容を覚えやすいのと同じ理由だ。つまり、体を動かしたり、絵を見たりして覚えることは、記憶に残りやすいということだ。","以上の点から、漫画のビジネス書は、ビジネスの知識を初めて学ぶ人にとって、効果的な学習方法だと言える。入門者にとって、わかりやすさは魅力だ。漫画形式のビジネス書をまだ読んだことがない人、難しそうでなかなか勉強が始められない分野があるという人は、一度読んでみてはいかがだろうか。新しい学びの体験と（51）。"],"tr":"（同前一篇）","qt":"下列四个选项中，哪个最适合填入空缺处？","opts":["としたら","としても","というなら","というのは"],"ans":3,"exp":"正解は「というのは」。「〜というのは、…と同じ理由だ」＝所谓…，与…是同一个道理，用于把前句内容提出来加以说明。「としたら」「としても」表假定，「というなら」表”如果你说…”。","notes":[{"t":"意識して","r":"いしきして","m":"有意识地"},{"t":"記憶","r":"きおく","m":"记忆"},{"t":"理由","r":"りゆう","m":"理由"}]},{"id":"N2S2607-51","lv":"N2","cat":"文法","tags":["文章の文法","2026-07"],"q":"51に入る最もよいものを、1・2・3・4から一つ選びなさい。","p":["「ビジネス書」と聞くと、難しい言葉が並んだ分厚い本を思い浮かべる人は多いのではないだろうか。しかし、最近は漫画で書かれたビジネス書も増えている。（48）研究によると、文章だけの本より漫画の本のほうが、内容を覚えている割合が高いそうだ。","漫画には、登場人物の会話や動きが描かれている。文章を読むだけでは想像しにくい場面も、漫画なら一目で理解できる。そのため、内容が頭に残りやすいのだと考えられている。（49）、漢字は、覚えようと意識して何度も書くほうが、読むだけより覚えやすい。手を動かすことで記憶が強くなるからだ（50）、漫画で内容を覚えやすいのと同じ理由だ。つまり、体を動かしたり、絵を見たりして覚えることは、記憶に残りやすいということだ。","以上の点から、漫画のビジネス書は、ビジネスの知識を初めて学ぶ人にとって、効果的な学習方法だと言える。入門者にとって、わかりやすさは魅力だ。漫画形式のビジネス書をまだ読んだことがない人、難しそうでなかなか勉強が始められない分野があるという人は、一度読んでみてはいかがだろうか。新しい学びの体験と（51）。"],"tr":"（同前一篇）","qt":"下列四个选项中，哪个最适合填入空缺处？","opts":["なるわけだ","なるはずだ","なるほどだ","なるようだ"],"ans":1,"exp":"正解は「なるはずだ」。「〜となるはずだ」＝理应会成为…，表示有根据的推断，用于收尾、给读者一个合理的预期。「わけだ」是”自然会…”（说明缘由），「なるほどだ」不成词，「ようだ」是”似乎”。","notes":[{"t":"入門者","r":"にゅうもんしゃ","m":"入门者"},{"t":"魅力","r":"みりょく","m":"魅力"},{"t":"体験","r":"たいけん","m":"体验"}]}]
const BANK_N3_2026=[{"id":"N3S2607-01","lv":"N3","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「計算」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"コンピューターで計算します。","tr":"用电脑计算。","opts":["けいざん","けいさん","けんさん","けんざん"],"ans":1,"exp":"正解は「けいさん」。「計算」＝计算，常用「計算する」。注意「けんさん（見さん）」不是词。","notes":[{"t":"計算","r":"けいさん","m":"计算"},{"t":"電車","r":"でんしゃ","m":"电车"},{"t":"機械","r":"きかい","m":"机器"}]},{"id":"N3S2607-02","lv":"N3","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「浅い」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"浅いほうの容器をください。","tr":"请给我浅一点的那个容器。","opts":["まるい","ふかい","かるい","あさい"],"ans":3,"exp":"正解は「あさい」。「浅い」＝浅的，反义词是「深い（ふかい）」。「丸い」是圆，「軽い」是轻。","notes":[{"t":"浅い","r":"あさい","m":"浅的"},{"t":"容器","r":"ようき","m":"容器"},{"t":"深い","r":"ふかい","m":"深的"}]},{"id":"N3S2607-03","lv":"N3","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「広告」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"兄は車の広告を作る仕事をしている。","tr":"哥哥做的是制作汽车广告的工作。","opts":["こうこく","ごうこく","こうごく","ごうごく"],"ans":0,"exp":"正解は「こうこく」。「広告」＝广告，「広」音读「こう」，「告」音读「こく」。","notes":[{"t":"広告","r":"こうこく","m":"广告"},{"t":"兄","r":"あに","m":"哥哥"},{"t":"仕事","r":"しごと","m":"工作"}]},{"id":"N3S2607-04","lv":"N3","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「種類」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"この店のチーズは種類が多い。","tr":"这家店的奶酪种类很多。","opts":["しゅるい","しゅれい","しゅうるい","しゅうれい"],"ans":0,"exp":"正解は「しゅるい」。「種」音读「しゅ」，「類」音读「るい」，长音位置不要弄错。","notes":[{"t":"種類","r":"しゅるい","m":"种类"},{"t":"店","r":"みせ","m":"店"},{"t":"多い","r":"おおい","m":"多"}]},{"id":"N3S2607-05","lv":"N3","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「勝った」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"今日は本田さんが勝ったそうです。","tr":"听说今天本田赢了。","opts":["たたかった","かった","はらった","くばった"],"ans":1,"exp":"正解は「かった」。「勝つ」＝获胜，过去式为「勝った」。「戦った（たたかった）」是战斗，「払った（はらった）」是支付，「配った（くばった）」是分发。","notes":[{"t":"勝った","r":"かった","m":"赢了"},{"t":"戦う","r":"たたかう","m":"战斗"},{"t":"配る","r":"くばる","m":"分发"}]},{"id":"N3S2607-06","lv":"N3","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「悲しい」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"悲しいときは、いつもここに来て海を見ていました。","tr":"难过的时候，我总是来这里看海。","opts":["くやしい","くるしい","かなしい","さびしい"],"ans":2,"exp":"正解は「かなしい」。「悔しい」是懊悔，「苦しい」是痛苦，「寂しい」是寂寞，四个词意思相近，要注意区分。","notes":[{"t":"悲しい","r":"かなしい","m":"悲伤"},{"t":"悔しい","r":"くやしい","m":"懊悔"},{"t":"寂しい","r":"さびしい","m":"寂寞"}]},{"id":"N3S2607-07","lv":"N3","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「整理」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"きちんと整理したほうがいいですよ。","tr":"还是好好整理一下比较好。","opts":["しゅり","しゅうり","せり","せいり"],"ans":3,"exp":"正解は「せいり」。「整理」＝整理、收拾。「修理（しゅうり）」是修理，字形相近易混。","notes":[{"t":"整理","r":"せいり","m":"整理"},{"t":"修理","r":"しゅうり","m":"修理"},{"t":"きちんと","r":"きちんと","m":"好好地"}]},{"id":"N3S2607-08","lv":"N3","cat":"漢字読み","tags":["漢字読み","2026-07"],"q":"「平均」の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"3歳の子どもの身長の平均はどのくらいですか。","tr":"3岁孩子的平均身高大约是多少？","opts":["へきん","へいやく","へいきん","へやく"],"ans":2,"exp":"正解は「へいきん」。「平均」＝平均，「均」音读「きん」，「均等（きんとう）」。","notes":[{"t":"平均","r":"へいきん","m":"平均"},{"t":"身長","r":"しんちょう","m":"身高"},{"t":"歳","r":"さい","m":"岁"}]},{"id":"N3S2607-09","lv":"N3","cat":"語彙","tags":["表記","2026-07"],"q":"「あぶら」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"鍋にあぶらを入れてください。","tr":"请往锅里放油。","opts":["貝","塩","油","豆"],"ans":2,"exp":"正解は「油」＝油。「塩（しお）」是盐，「豆（まめ）」是豆，「貝（かい）」是贝，都与”油”无关。","notes":[{"t":"油","r":"あぶら","m":"油"},{"t":"鍋","r":"なべ","m":"锅"},{"t":"塩","r":"しお","m":"盐"}]},{"id":"N3S2607-10","lv":"N3","cat":"語彙","tags":["表記","2026-07"],"q":"「ながした」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"その話を聞いて、みんな涙をながした。","tr":"听了那番话，大家都流下了眼泪。","opts":["落した","流した","泣した","汚した"],"ans":1,"exp":"正解は「流した」。「涙を流す」＝流泪，是固定搭配。「落とす」是掉落，「泣く」是哭（但不能说「泣した」），「汚す」是弄脏。","notes":[{"t":"涙","r":"なみだ","m":"眼泪"},{"t":"流す","r":"ながす","m":"流"},{"t":"汚す","r":"よごす","m":"弄脏"}]},{"id":"N3S2607-11","lv":"N3","cat":"語彙","tags":["表記","2026-07"],"q":"「くべつ」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"この二つはよく似ているので、くべつしにくい。","tr":"这两个很像，很难区分。","opts":["区別","区制","図別","図制"],"ans":0,"exp":"正解は「区別」＝区分、区别。「区」＝区分，「別」＝区别。后三项为假词。","notes":[{"t":"区別","r":"くべつ","m":"区分"},{"t":"似ている","r":"にている","m":"相似"},{"t":"制度","r":"せいど","m":"制度"}]},{"id":"N3S2607-12","lv":"N3","cat":"語彙","tags":["表記","2026-07"],"q":"「つつんで」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"早くつつんでください。","tr":"请快点包起来。","opts":["運んで","結んで","包んで","選んで"],"ans":2,"exp":"正解は「包んで」。「包む」＝包、包裹。「運ぶ」是搬运，「結ぶ」是系、连结，「選ぶ」是选择，读音相近易混。","notes":[{"t":"包む","r":"つつむ","m":"包裹"},{"t":"運ぶ","r":"はこぶ","m":"搬运"},{"t":"結ぶ","r":"むすぶ","m":"系、结"}]},{"id":"N3S2607-13","lv":"N3","cat":"語彙","tags":["表記","2026-07"],"q":"「めいれい」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"これは社長のめいれいです。","tr":"这是社长的命令。","opts":["名例","命例","名令","命令"],"ans":3,"exp":"正解は「命令」＝命令。「命」＝命令，「令」＝令，其余组合都是假词。","notes":[{"t":"命令","r":"めいれい","m":"命令"},{"t":"社長","r":"しゃちょう","m":"社长"},{"t":"例","r":"れい","m":"例子"}]},{"id":"N3S2607-14","lv":"N3","cat":"語彙","tags":["表記","2026-07"],"q":"「うせつ」を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","b":"その交差点をうせつしてください。","tr":"请在那个十字路口右转。","opts":["左折","右折","右切","左切"],"ans":1,"exp":"正解は「右折」＝右转。「折」＝转弯（折れる），「右折・左折」是固定说法。用「切」的组合不成词。","notes":[{"t":"交差点","r":"こうさてん","m":"十字路口"},{"t":"右折","r":"うせつ","m":"右转"},{"t":"左折","r":"させつ","m":"左转"}]},{"id":"N3S2607-15","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"手を洗った後は、そのコップを使って（　）をしてください。","tr":"洗完手之后，请用那个杯子漱口。","opts":["あくび","いびき","うがい","しゃっくり"],"ans":2,"exp":"正解は「うがい」＝漱口。「あくび」是打哈欠，「いびき」是打呼噜，「しゃっくり」是打嗝，只有”用杯子”能搭配漱口。","notes":[{"t":"うがい","r":"うがい","m":"漱口"},{"t":"あくび","r":"あくび","m":"哈欠"},{"t":"コップ","r":"こっぷ","m":"杯子"}]},{"id":"N3S2607-16","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"昨日友達と行った映画館はとてもすいていて、（　）が多かった。","tr":"昨天和朋友去的电影院很空，空座位很多。","opts":["不要","欠席","不足","空席"],"ans":3,"exp":"正解は「空席」＝空座。「すいている」＝（场所）空、不拥挤，所以座位是”空席”。「欠席」是缺席（指人），「不足」是数量不足。","notes":[{"t":"空席","r":"くうせき","m":"空座"},{"t":"映画館","r":"えいがかん","m":"电影院"},{"t":"欠席","r":"けっせき","m":"缺席"}]},{"id":"N3S2607-17","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"最近洗濯機の（　）がよくないので、新しいのを買うつもりです。","tr":"最近洗衣机的状况不太好，打算买台新的。","opts":["環境","調子","事情","都合"],"ans":1,"exp":"正解は「調子」。「調子がいい／悪い」＝（机器、身体）状态好／不好，是固定搭配。「都合」用于时间、情况。","notes":[{"t":"洗濯機","r":"せんたくき","m":"洗衣机"},{"t":"調子","r":"ちょうし","m":"状态"},{"t":"都合","r":"つごう","m":"方便、情况"}]},{"id":"N3S2607-18","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"その映画は、内容はよく覚えているが（　）が思い出せない。","tr":"那部电影的内容我记得很清楚，但想不起片名。","opts":["フォルム","タイトル","チケット","イメージ"],"ans":1,"exp":"正解は「タイトル」＝标题、片名。「フォルム」是形态，「チケット」是票，「イメージ」是印象，与”内容记得、名字想不起”的对比不合。","notes":[{"t":"内容","r":"ないよう","m":"内容"},{"t":"思い出せない","r":"おもいだせない","m":"想不起来"},{"t":"映画","r":"えいが","m":"电影"}]},{"id":"N3S2607-19","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"明日のスピーチでメモを見ないで話すために、文章を全部（　）した。","tr":"为了明天演讲时不看稿，我把文章全部背了下来。","opts":["納得","学習","暗記","観察"],"ans":2,"exp":"正解は「暗記」＝背诵。「暗記する」指把内容记在脑子里。「納得」是理解、信服，「学習」是学习，「観察」是观察。","notes":[{"t":"暗記","r":"あんき","m":"背诵"},{"t":"スピーチ","r":"すぴーち","m":"演讲"},{"t":"納得","r":"なっとく","m":"理解、信服"}]},{"id":"N3S2607-20","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"暗い所から急に明るい所に出たので、（　）目を閉じてしまった。","tr":"从暗处突然走到亮处，光太刺眼，不由得闭上了眼睛。","opts":["まぶしくて","きびしくて","めずらしくて","あたたかくて"],"ans":0,"exp":"正解は「まぶしくて」＝刺眼。「厳しい」是严厉，「珍しい」是稀奇，「暖かい」是温暖，都与光线强无关。","notes":[{"t":"まぶしい","r":"まぶしい","m":"刺眼"},{"t":"目を閉じる","r":"めをとじる","m":"闭眼"},{"t":"珍しい","r":"めずらしい","m":"稀奇"}]},{"id":"N3S2607-21","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"危ないですから、自転車のハンドルを（　）握ってください。","tr":"很危险，请牢牢握住自行车把手。","opts":["ぴったり","しっかり","はっきり","うっかり"],"ans":1,"exp":"正解は「しっかり」＝牢牢地、好好地。「ぴったり」是恰好、紧贴，「はっきり」是清楚，「うっかり」是不小心（副词，多修饰失误）。","notes":[{"t":"ハンドル","r":"はんどる","m":"把手"},{"t":"握る","r":"にぎる","m":"握"},{"t":"しっかり","r":"しっかり","m":"牢牢地"}]},{"id":"N3S2607-22","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"祖父は長い間、村のために働いてきたので、村の人たちからとても（　）されている。","tr":"祖父长年为村子做事，所以深受村民尊敬。","opts":["尊敬","賛成","愛用","遠慮"],"ans":0,"exp":"正解は「尊敬」＝尊敬。「尊敬される」＝受到尊敬。「賛成」是赞成（对意见），「愛用」是爱用（对物品），「遠慮」是客气。","notes":[{"t":"尊敬","r":"そんけい","m":"尊敬"},{"t":"祖父","r":"そふ","m":"祖父"},{"t":"遠慮","r":"えんりょ","m":"客气"}]},{"id":"N3S2607-23","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"風邪で熱があるので、ベッドから起きて歩くと、体が（　）します。","tr":"因为感冒发烧，从床上起来走路，身体就摇摇晃晃的。","opts":["はらはら","きょろきょろ","ふらふら","うろうろ"],"ans":2,"exp":"正解は「ふらふら」＝（身体）摇晃、站不稳。「きょろきょろ」是东张西望，「うろうろ」是徘徊，「はらはら」是（心）紧张、（花）飘落。","notes":[{"t":"ふらふら","r":"ふらふら","m":"摇摇晃晃"},{"t":"風邪","r":"かぜ","m":"感冒"},{"t":"熱","r":"ねつ","m":"发烧"}]},{"id":"N3S2607-24","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"この薬は、歯の痛みを（　）ことができるそうです。","tr":"听说这种药可以抑制牙痛。","opts":["隠す","壊す","下ろす","抑える"],"ans":3,"exp":"正解は「抑える」＝抑制、压住（疼痛、感情、上涨）。「隠す」是隐藏，「壊す」是弄坏，「下ろす」是放下、卸下。","notes":[{"t":"抑える","r":"おさえる","m":"抑制"},{"t":"痛み","r":"いたみ","m":"疼痛"},{"t":"薬","r":"くすり","m":"药"}]},{"id":"N3S2607-25","lv":"N3","cat":"語彙","tags":["文脈規定","2026-07"],"q":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","b":"雪のない時期でも、最近の技術では（　）雪を降らせることができる。","tr":"即使在没雪的季节，以最近的技术也能人工降雪。","opts":["消極的に","人工的に","抽象的に","代表的に"],"ans":1,"exp":"正解は「人工的に」＝人工地。「人工雪」是固定说法。「消極的」是消极的，「抽象的」是抽象的，「代表的」是代表性的。","notes":[{"t":"人工","r":"じんこう","m":"人工"},{"t":"技術","r":"ぎじゅつ","m":"技术"},{"t":"降らせる","r":"ふらせる","m":"使降下"}]},{"id":"N3S2607-26","lv":"N3","cat":"語彙","tags":["類義","2026-07"],"q":"「らくな」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"思っていたよりらくなアルバイトだった。","tr":"这份兼职比想象的轻松。","opts":["自由な","簡単な","面白い","難しい"],"ans":1,"exp":"正解は「簡単な」。「楽だ」＝轻松、不费劲，与「簡単だ」意思接近。「自由」是自由，「面白い」是有趣，「難しい」是困难（相反）。","notes":[{"t":"楽","r":"らく","m":"轻松"},{"t":"アルバイト","r":"あるばいと","m":"兼职"},{"t":"簡単","r":"かんたん","m":"简单"}]},{"id":"N3S2607-27","lv":"N3","cat":"語彙","tags":["類義","2026-07"],"q":"「しゃべっている」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"彼は何かしゃべっているようです。","tr":"他好像在说些什么。","opts":["話して","考えて","見て","探して"],"ans":0,"exp":"正解は「話して」。「しゃべる」＝说、讲（口语），与「話す」最近。「考える」是想，「探す」是找。","notes":[{"t":"しゃべる","r":"しゃべる","m":"说、讲"},{"t":"話す","r":"はなす","m":"说"},{"t":"探す","r":"さがす","m":"寻找"}]},{"id":"N3S2607-28","lv":"N3","cat":"語彙","tags":["類義","2026-07"],"q":"「サイズ」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"この写真では実際のサイズが分かりません。","tr":"从这张照片看不出实际大小。","opts":["色","重さ","大きさ","形"],"ans":2,"exp":"正解は「大きさ」。「サイズ」＝尺寸、大小。「重さ」是重量，「形」是形状，「色」是颜色。","notes":[{"t":"サイズ","r":"さいず","m":"尺寸"},{"t":"実際","r":"じっさい","m":"实际"},{"t":"重さ","r":"おもさ","m":"重量"}]},{"id":"N3S2607-29","lv":"N3","cat":"語彙","tags":["類義","2026-07"],"q":"「多忙しく」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"来月から多忙しくなりそうです。","tr":"下个月开始好像会非常忙。","opts":["ちょっと","とても","いろいろ","もっと"],"ans":1,"exp":"正解は「とても」。「多忙」＝非常忙，「多」表示程度很高，相当于「とても」。「いろいろ」是各种各样。","notes":[{"t":"多忙","r":"たぼう","m":"繁忙"},{"t":"来月","r":"らいげつ","m":"下个月"},{"t":"忙しい","r":"いそがしい","m":"忙"}]},{"id":"N3S2607-30","lv":"N3","cat":"語彙","tags":["類義","2026-07"],"q":"「交換して」に意味が最も近いものを、1・2・3・4から一つ選びなさい。","b":"山下さんが部品を交換してくれました。","tr":"山下帮我换了零件。","opts":["持ってきて","組み立てて","片づけて","取りかえて"],"ans":3,"exp":"正解は「取りかえて」。「取り替える」＝更换，与「交換する」最近。「組み立てる」是组装，「片づける」是收拾。","notes":[{"t":"交換","r":"こうかん","m":"交换、更换"},{"t":"部品","r":"ぶひん","m":"零件"},{"t":"取り替える","r":"とりかえる","m":"更换"}]},{"id":"N3S2607-31","lv":"N3","cat":"語彙","tags":["用法","2026-07"],"q":"「看板」の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"（次の文のうち、「看板」を正しく使っているものを選ぶ）","tr":"选出「看板」用得最正确的一句。","opts":["私の学校では、先生も生徒も胸に看板をつけています。","似ている物が多いので、スーツケースに自分の看板をつけた。","昨日もらった鈴木さんの看板には、課長と書かれていた。","薬局は、あの赤い大きな看板があるお店です。"],"ans":3,"exp":"正解は4。「看板」＝店鋪、公司门口的大招牌。1、2、3 说的其实是「名札（なふだ）」（名牌、姓名牌）。","notes":[{"t":"看板","r":"かんばん","m":"招牌"},{"t":"名札","r":"なふだ","m":"名牌"},{"t":"薬局","r":"やっきょく","m":"药房"}]},{"id":"N3S2607-32","lv":"N3","cat":"語彙","tags":["用法","2026-07"],"q":"「募集」の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"（次の文のうち、「募集」を正しく使っているものを選ぶ）","tr":"选出「募集」用得最正确的一句。","opts":["父は趣味で古い切手を募集している。","新しくできたスーパーでアルバイトを募集している。","この歌手は今、世界中の若者の人気を募集している。","社員を会議室に募集して、会議を開いた。"],"ans":1,"exp":"正解は2。「募集」＝招募（人、作品、意见等），对象多为”人”。收集邮票用「集める」，聚集人员用「集める」，人气用「集める」。","notes":[{"t":"募集","r":"ぼしゅう","m":"招募"},{"t":"切手","r":"きって","m":"邮票"},{"t":"集める","r":"あつめる","m":"收集"}]},{"id":"N3S2607-33","lv":"N3","cat":"語彙","tags":["用法","2026-07"],"q":"「消費」の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","b":"（次の文のうち、 function questionMaterials(){
  const byQuestion=new Map();
  for(const book of baseBooks()){
    const groups=new Map((book.materials||[]).map(m=>[m.id,{material:m,questions:[]}]));
    for(const q of book.qs){
      const group=groups.get(q.materialId);
      if(group){ group.questions.push(q); byQuestion.set(q.id,group); }
    }
  }
  return byQuestion;
}

function load(){

  S.custom=(d&&Array.isArray(d.custom))?d.custom:[];
  S.prog=(d&&d.prog&&typeof d.prog==='object')?d.prog:{};

    : ((d&&Array.isArray(d.bank)&&d.bank.length)?[{id:'legacy',name:'読み込み題庫',level:'',qs:d.bank}]:null);
  const f=(d&&d.fav&&typeof d.fav==='object')?d.fav:{};
  S.fav={q:Array.isArray(f.q)?f.q.filter(x=>typeof x==='string'):[],
         w:Array.isArray(f.w)?f.w.filter(x=>x&&x.t):[],
         g:Array.isArray(f.g)?f.g.filter(x=>x&&x.g):[]};
  S.sync=(d&&d.sync&&d.sync.code&&d.sync.key)?{code:String(d.sync.code),key:String(d.sync.key),lastAt:Number(d.sync.lastAt)||0}:null;

/* ---------- 端末同期（Supabase） ---------- */
/* 使い方：Supabase の Project URL と anon key をここに入れる（README / supabase/schema.sql 参照） */
const SYNC_CFG={url:'https://prxapqxduqvlpywnutwj.supabase.co',anon:'sb_publishable_Q6CU46sEiUC1r3eHl0zD_g_3fvAJ34k'};
const syncReady=()=>!!(SYNC_CFG.url&&SYNC_CFG.anon);
const syncOn=()=>!!(S.sync&&S.sync.code&&S.sync.key);
function snap(){ return {prog:S.prog,custom:S.custom,fav:S.fav,log:S.log.slice(-4000)}; }
function syncHeaders(){
  const headers={'Content-Type':'application/json','apikey':SYNC_CFG.anon};
  if(!SYNC_CFG.anon.startsWith('sb_publishable_')) headers.Authorization='Bearer '+SYNC_CFG.anon;
  return headers;
}
async function sbRpc(fn,body){
  const base=String(SYNC_CFG.url).replace(/\/+$/,'');
  const r=await fetch(base+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:syncHeaders(),
    body:JSON.stringify(body)
  });
  const txt=await r.text();
  if(!r.ok) throw new Error((txt||('HTTP '+r.status)).slice(0,160));
  return txt?JSON.parse(txt):null;
}
function mergeRemote(remote){
  if(!remote||typeof remote!=='object') return 0;
  let changed=0;
  const rp=remote.prog||{};
  Object.keys(rp).forEach(id=>{
    const b=rp[id]; if(!b||typeof b!=='object') return;
    const a=S.prog[id];
    if(!a||(b.n||0)>(a.n||0)||((b.n||0)===(a.n||0)&&(b.last||0)>(a.last||0))){ S.prog[id]=Object.assign({},b); changed++; }
  });
  (Array.isArray(remote.custom)?remote.custom:[]).forEach(q=>{
    if(q&&q.id&&!S.custom.some(x=>x.id===q.id)){ S.custom.push(q); changed++; }
  });
  const rf=remote.fav||{};
  (Array.isArray(rf.q)?rf.q:[]).forEach(id=>{ if(typeof id==='string'&&S.fav.q.indexOf(id)<0){ S.fav.q.push(id); changed++; } });
  (Array.isArray(rf.w)?rf.w:[]).forEach(x=>{ if(x&&x.t&&!S.fav.w.some(y=>y.t===x.t)){ S.fav.w.push(x); changed++; } });
  (Array.isArray(rf.g)?rf.g:[]).forEach(x=>{ if(x&&x.g&&!S.fav.g.some(y=>y.g===x.g)){ S.fav.g.push(x); changed++; } });
  const seen=new Set(S.log.map(e=>e.t+'|'+e.id));
  (Array.isArray(remote.log)?remote.log:[]).forEach(e=>{ if(e&&e.id&&!seen.has(e.t+'|'+e.id)){ S.log.push(e); changed++; } });
  S.log.sort((a,b)=>(a.t||0)-(b.t||0));
  if(S.log.length>4000) S.log=S.log.slice(-4000);
  return changed;
}
async function syncPull(quiet){
  if(!syncOn()) return false;
  const sync=S.sync;
  try{
    const d=await sbRpc('state_get',{p_code:sync.code,p_key:sync.key});
    if(S.sync!==sync) return false;
    if(d&&typeof d==='object'){
      const c=mergeRemote(d);
      S.sync.lastAt=Date.now();
      save({noSync:true}); render();
      if(!quiet) toast(c?('他の端末の記録を取り込みました（'+c+' 件）'):'すでに最新です');
      return true;
    }
    if(!quiet) toast('このコードの記録が見つかりません。コードと鍵を確認してください');
    return false;
  }catch(e){ if(!quiet) toast('同期に失敗しました：'+String(e.message||e)); return false; }
}
async function syncPush(quiet){
  if(!syncOn()) return false;
  const sync=S.sync;
  const credentials={p_code:sync.code,p_key:sync.key};
  try{
    /* アップロード前に必ず一度取得してマージする（別端末の新しい記録を古いスナップショットで上書きしないため） */
    const d=await sbRpc('state_get',credentials);
    if(S.sync!==sync) return false;
    if(d&&typeof d==='object') mergeRemote(d);
    const written=await sbRpc('state_put',{...credentials,p_data:snap()});
    if(S.sync!==sync) return false;
    if(written!==true) throw new Error('サーバーが保存を受け付けませんでした。コードと鍵を確認してください');
    S.sync.lastAt=Date.now();
    save({noSync:true});
    if(!quiet) toast('同期しました');
    return true;
  }catch(e){ if(!quiet) toast('同期に失敗しました：'+String(e.message||e)); return false; }
}
let syncT=0;
function syncSchedule(){
  if(!syncOn()) return;
  clearTimeout(syncT);
  syncT=setTimeout(()=>{ syncPush(true); },6000);
}
function syncRnd(n,alpha){
  const A=alpha||'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<n;i++) s+=A[Math.floor(Math.random()*A.length)];
  return s;
}

async function syncJoin(code,key){

  code=String(code||'').trim().toUpperCase();

}

}

async function syncDiag(){

  const H=syncHeaders();

function wrapNote(n){
  const cls='a'+(n.u?' tg':'');
  const w=esc(n.t);

  const m=esc(n.m||'');
  const aria=esc(n.t+(n.r?'（'+n.r+'）':'')+(n.m?'：'+n.m:''));
  if(S.conf.rubi==='always'&&n.r){
    return '<ruby class="'+cls+'" data-w="'+w+'" data-r="'+r+'" data-m="'+m+'" aria-label="'+aria+'">'+w+'<rt>'+esc(n.r)+'</rt></ruby>';
  }
  return '<span class="'+cls+'" data-w="'+w+'" data-r="'+r+'" data-m="'+m+'" aria-label="'+aria+'">'+w+'</span>';
}
function annotate(text,notes){
  if(!text) return '';
  const map=new Map();
  (notes||[]).forEach(n=>{ if(n&&n.t&&!map.has(n.t)) map.set(n.t,n); });
  if(!map.size) return esc(text);
  const keys=[...map.keys()].sort((a,b)=>b.length-a.length);
  const re=new RegExp('('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
  let out='',last=0,m;
  while((m=re.exec(text))){
    out+=esc(text.slice(last,m.index))+wrapNote(map.get(m[0]));
    last=m.index+m[0].length;
  }
  out+=esc(text.slice(last));
  return out;
}

/* ---------- 選択肢の並び（問題ごとに固定） ---------- */
function orderOf(id,n){
  let h=2166136261;
  for(let i=0;i<id.length;i++){ h^=id.charCodeAt(i); h=Math.imul(h,16777619); }
  let s=(h>>>0)||987654321;
  const rnd=()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  const arr=[]; for(let i=0;i<n;i++) arr.push(i);
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

/* ---------- 集計 ---------- */
function dayKey(ms){
  const d=new Date(ms);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function agg(){
  const now=Date.now();
  const out={total:0,ok:0,ng:0,acc:0,seen:0,master:0,fresh:0,due:0,bank:allQ().length,today:0,log7:[],streak:0,cat:{},lv:{},tag:{}};
  CATS.forEach(c=>out.cat[c]={n:0,ok:0,ng:0});
  LVS.forEach(l=>out.lv[l]={n:0,ok:0,ng:0,seen:0,master:0,total:0});
  allQ().forEach(q=>{
    let L=out.lv[q.lv];
    if(!L){ L=out.lv[q.lv]={n:0,ok:0,ng:0,seen:0,master:0,total:0}; }
    L.total++;
    const p=S.prog[q.id];
    if(!p||!p.n){ out.fresh++; return; }
    out.seen++; out.total+=p.n; out.ok+=p.ok||0; out.ng+=p.ng||0;
    if(!out.cat[q.cat]) out.cat[q.cat]={n:0,ok:0,ng:0};
    out.cat[q.cat].n+=p.n; out.cat[q.cat].ok+=p.ok||0; out.cat[q.cat].ng+=p.ng||0;
    L.n+=p.n; L.ok+=p.ok||0; L.ng+=p.ng||0; L.seen++;
    if((p.box||0)>=3){ out.master++; L.master++; }
    if(p.due&&p.due<=now) out.due++;
    (q.tags||[]).forEach(t=>{
      const g=out.tag[t]||(out.tag[t]={n:0,ok:0,ng:0,items:0});
      g.n+=p.n; g.ok+=p.ok||0; g.ng+=p.ng||0; g.items++;
    });
  });
  out.acc=out.total?out.ok/out.total:0;
  const todayK=dayKey(now);
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(now-i*DAY);
    days.push({k:dayKey(d.getTime()),w:WD[d.getDay()],n:0,ok:0});
  }
  const map=new Map(days.map(d=>[d.k,d]));
  S.log.forEach(e=>{
    const k=dayKey(e.t);
    const d=map.get(k);
    if(d){ d.n++; if(e.ok) d.ok++; }
    if(k===todayK) out.today++;
  });
  out.log7=days;
  const set=new Set(S.log.map(e=>dayKey(e.t)));
  let i=set.has(todayK)?0:1, st=0;
  for(;i<400;i++){
    const k=dayKey(now-i*DAY);
    if(set.has(k)) st++; else break;
  }
  out.streak=st;
  return out;
}
const rateOf=L=>(L&&L.n)?L.ok/L.n:0;
function estimateLevel(a){
  const g=l=>a.lv[l]||{n:0,ok:0,seen:0};
  const rate=L=>L.n?L.ok/L.n:-1;
  if(!a||!a.total) return {band:0,label:'未測定',note:'まだ一問も解いていません。まず 10 問で基準線をつくります。',next:'N4 範囲で 10 問',trust:0};
  const n4=g('N4'),n3=g('N3'),n2=g('N2');
  const r4=rate(n4),r3=rate(n3),r2=rate(n2);
  const ok=(L,m)=>L.n>=m;
  if(ok(n2,10)&&r2>=0.7) return {band:7,label:'N2 合格圏の入口',note:'N2 範囲で 7 割。残るのは読解の時間制限と聴解。',next:'N2 読解を時間制で 1 日 1 本',trust:1};
  if(ok(n2,8)&&r2>=0.5) return {band:6,label:'N2 入口',note:'N2 範囲で 5 割前後。文法・語彙の穴を埋める段階。',next:'N2 文法を 1 周、N3 の誤答タグを潰す',trust:0.9};
  if(ok(n3,10)&&r3>=0.75) return {band:5,label:'N3 完成',note:'N3 範囲で 7 割 5 分。N2 に移行してよい水準。',next:'N2 の文字・語彙を 1 周（N3 も 3 割残す）',trust:0.9};
  if(ok(n3,8)&&r3>=0.6) return {band:4,label:'N3 中盤',note:'N3 で 6 割。並べ替え・文章の文法が崩れやすい段階。',next:'N3 文法を周回、N2 は 2 割だけ触れる',trust:0.85};
  if(ok(n3,8)&&r3>=0.45) return {band:3,label:'N3 入口',note:'N3 で 4〜5 割。N4 の取りこぼしが残っている可能性が高い。',next:'N3 を主力に、N4 で取りこぼしを回収',trust:0.8};
  if(ok(n4,8)&&r4>=0.8) return {band:2,label:'N4 完成',note:'N4 で 8 割。N3 の入口に立っている。',next:'N3 の文法と語彙を主力に（N2 は触り程度）',trust:0.8};
  if(ok(n4,8)&&r4>=0.6) return {band:1,label:'N4 中盤',note:'N4 で 6〜8 割。基礎は動いているが穴が残る。',next:'N4 の誤答タグを潰し、N3 を 3 割混ぜる',trust:0.7};
  return {band:0,label:'N4 基礎',note:'サンプルがまだ少ない（各レベル 8 問以上で判定）。',next:'N4 の文法と語彙を一巡（毎日 15 問）',trust:0.4};
}

function lvBars(a){

  }).join('');
  return '<div class="lvbars">'+rows+'</div>'+

/* ---------- 抽選 ---------- */
let __estCache=null,__estAt=0;
function estNow(){
  const t=Date.now();
  if(!__estCache||t-__estAt>30000){ __estCache=estimateLevel(agg()); __estAt=t; }
  return __estCache;
}
function lvWeight(lv){
  const b=S.conf.lvBias||'n3';
  if(b==='even') return 1;
  if(b==='n2') return lv==='N2'?1.5:(lv==='N3'?1:0.6);
  if(b==='auto'){
    const band=estNow().band;
    if(band<=2) return lv==='N4'?1.3:(lv==='N3'?1.2:0.35);
    if(band<=4) return lv==='N4'?0.6:(lv==='N3'?1.5:0.5);
    return lv==='N4'?0.35:(lv==='N3'?1:1.4);
  }
  return lv==='N3'?1.5:(lv==='N4'?0.9:0.5);
}
function weightOf(q){
  const p=S.prog[q.id];
  const now=Date.now();
  let base = (!p||!p.n) ? S.conf.wNew : (p.lastOk===false ? S.conf.wWrong : S.conf.wCorrect);
  const overdue = (p&&p.due) ? Math.max(0,(now-p.due)/DAY) : 0;
  return Math.max(0.05, base*(1+overdue*(S.conf.dueGain||0))*lvWeight(q.lv));
}
function buildQueue(cfg){
  let pool=allQ().filter(q=>poolQ(q,cfg));
  if(!pool.length) return [];
  if(cfg.mode==='order') return pool.slice(0,cfg.count).map(q=>q.id);
  if(cfg.mode==='new'){
    const n=pool.filter(q=>!S.prog[q.id]||!S.prog[q.id].n);
    if(n.length) pool=n;
  }
  if(cfg.mode==='review'){
    const r=pool.filter(q=>S.prog[q.id]&&S.prog[q.id].n);
    if(r.length) pool=r;
  }
  const n=Math.min(cfg.count,pool.length);
  const scored=pool.map(q=>({id:q.id,k:Math.pow(Math.random(),1/weightOf(q))}));
  scored.sort((a,b)=>b.k-a.k);
  const byId=new Map(pool.map(q=>[q.id,q]));
  const lvOf=id=>(byId.get(id)||{}).lv;
  let ids=scored.slice(0,n).map(x=>x.id);
  const bias=S.conf.lvBias||'n3';
  if(cfg.lv==='all'&&bias!=='n2'&&bias!=='even'){
    const cap=Math.max(1,Math.round(n*(bias==='n3'?0.2:0.3)));
    let over=ids.filter(id=>lvOf(id)==='N2').length-cap;
    if(over>0){
      const spare=scored.slice(n).map(x=>x.id).filter(id=>lvOf(id)!=='N2');
      ids=ids.map(id=>{ if(over>0&&lvOf(id)==='N2'&&spare.length){ over--; return spare.shift(); } return id; });
    }
  }
  return ids;
}

/* ---------- セッション ---------- */
function practiceUnits(questions,materials,combine){
  const units=[], grouped=new Map();
  for(const q of questions){
    const group=materials.get(q.id);
    if(!group||!combine){ units.push({questions:[q],material:group?.material}); continue; }
    if(!grouped.has(group)){
      const unit={questions:[],material:group.material,grouped:true};
      grouped.set(group,unit); units.push(unit);
    }
    grouped.get(group).questions.push(q);
  }
  for(const [group,unit] of grouped){
    const selected=new Set(unit.questions.map(q=>q.id));
    unit.questions=group.questions.filter(q=>selected.has(q.id));
  }
  return units;
}
function buildMaterialQueue(cfg,questions=allQ(),materials=questionMaterials()){
  let units=practiceUnits(questions.filter(q=>poolQ(q,cfg)),materials,true);
  if(cfg.mode==='new'||cfg.mode==='review'){
    const preferred=units.filter(u=>u.questions.some(q=>cfg.mode==='new'?!S.prog[q.id]?.n:!!S.prog[q.id]?.n));
    if(preferred.length) units=preferred;
  }
  if(cfg.mode!=='order'){
    units=units.map(unit=>({unit,k:Math.pow(Math.random(),1/Math.max(...unit.questions.map(weightOf)))}))
      .sort((a,b)=>b.k-a.k).map(({unit})=>unit);
  }
  return units.slice(0,Number(cfg.count)||3);
}
const currentUnit=()=>SS&&!SS.done?SS.units[SS.i]:null;
const audioSource=unit=>unit.material?.type==='listening'?unit.material:unit.questions[0];
function newChoice(q){
  const order=q.cat==='聴解'?q.opts.map((_,i)=>i):orderOf(q.id,q.opts.length);
  return {id:q.id,order,ans:order.indexOf(q.ans),chosen:null,ok:null};
}
function startSession(cfg,preview){
  cfg=Object.assign({},cfg||{});
  let units=preview;
  if(!units){
    const questions=allQ(), materials=questionMaterials();
    if(cfg.byMaterial){ units=buildMaterialQueue(cfg,questions,materials); }
    else{
      cfg.count=Number(cfg.count)||10;
      const ids=cfg.ids||buildQueue(cfg);
      const byId=new Map(questions.slice().reverse().map(q=>[q.id,q]));
      units=practiceUnits([...new Set(ids)].map(id=>byId.get(id)).filter(Boolean),materials,!!cfg.ids);
    }
  }
  if(!units.length){ toast('この条件に合う問題がありません。レベルか分野を広げてください。'); return; }
  auHalt();
  SS={units:units.map(u=>({...u})),i:0,res:[],start:Date.now(),repeated:new Set(),cur:null,done:false,cfg};
  if(page!=='practice') location.hash='#/practice'; else render();
  window.scrollTo(0,0);
}
function recordAnswer(q,ok,retry=false){
  const now=Date.now();
  const p=S.prog[q.id]||{n:0,ok:0,ng:0,box:0,due:0,last:0};
  p.n=(p.n||0)+1; p.last=now; p.lastOk=ok;
  if(ok){
    p.ok=(p.ok||0)+1;
    p.box=Math.min((p.box||0)+1,S.conf.intervals.length);
    p.due=now+S.conf.intervals[Math.max(0,p.box-1)]*DAY;
  }else{
    p.ng=(p.ng||0)+1; p.box=0; p.due=now+10*60000;
  }
  S.prog[q.id]=p;
  S.log.push({t:now,id:q.id,ok,cat:q.cat,lv:q.lv});
  SS.res.push({id:q.id,ok,retry});
}
function answer(d){
  const unit=currentUnit(),cur=SS?.cur;
  if(!unit||!cur||unit.submitted||!Number.isInteger(d)||d<0||d>=cur.order.length) return;
  if(unit.grouped){ cur.chosen=d; render(); return; }
  if(cur.chosen!==null) return;
  const q=unit.questions[0];
  cur.chosen=d; cur.ok=d===cur.ans;
  recordAnswer(q,cur.ok,!!unit.retry);
  if(!cur.ok&&!unit.retry&&S.conf.repeatWrong&&!SS.repeated.has(q.id)){
    SS.repeated.add(q.id);
    SS.units.splice(Math.min(SS.i+3,SS.units.length),0,{questions:unit.questions,material:unit.material,retry:true});
  }
  save(); render();
}
function groupReady(unit){
  return unit.grouped&&!unit.submitted&&unit.choices?.every(c=>c.chosen!==null)&&
    (unit.material.type!=='listening'||unit.auDone);
}
function submitGroup(){
  const unit=currentUnit();
  if(!unit||!groupReady(unit)) return;
  unit.submitted=true;
  auHalt();
  unit.questions.forEach((q,i)=>{
    const choice=unit.choices[i];
    choice.ok=choice.chosen===choice.ans;
    recordAnswer(q,choice.ok);
  });
  save(); render();
}
function nextQ(){
  const unit=currentUnit();
  if(!unit||(unit.grouped?!unit.submitted:SS.cur?.chosen==null)) return;
  auHalt();
  SS.cur=null; SS.i++;
  if(SS.i>=SS.units.length) SS.done=true;
  render();
  window.scrollTo(0,0);
}

function render(){
  const lastPassage=$('#material-passage');
  if(displayedUnit&&lastPassage?.clientHeight) displayedUnit.passageScroll=lastPassage.scrollTop;
  page=(location.hash||'#/home').replace(/^#\//,'').split('?')[0]||'home';
  /* 練習の問題画面を離れたら、鳴っている音声を必ず止める */
  if(AU&&(page!=='practice'||!SS||SS.done)) auHalt();
  if(!PAGES.some(p=>p[0]===page)) page='home';
  $('#nav').innerHTML=PAGES.map(([k,l])=>'<a href="#/'+k+'" class="'+(page===k?'on':'')+'">'+l+'</a>').join('');
  updateRail();
  const view=$('#view');
  if(page==='home') view.innerHTML=homeHtml();
  else if(page==='practice') view.innerHTML=practiceHtml();
  else if(page==='fav') view.innerHTML=favHtml();
  else if(page==='review') view.innerHTML=reviewHtml();
  else if(page==='analysis') view.innerHTML=analysisHtml();
  else if(page==='info') view.innerHTML=infoHtml();

function fullTr(q){
  const rows=[];
  if(Array.isArray(q.p)&&Array.isArray(q.pt)) q.pt.forEach(t=>{ if(t) rows.push('<p>'+esc(t)+'</p>'); });
  if(q.tr) rows.push('<p>'+esc(q.tr)+'</p>');
  const st=qStemTr(q);
  if(st) rows.push('<p class="tr-q">'+esc(st)+'</p>');

/* ---------- 音声（聴解） ---------- */
let AU=null, audioClip=null, audioTimer=0;
function auUrl(u){
  u=String(u||'');
  if(/^https?:\/\//i.test(u)) return u;
  const local=['127.0.0.1','localhost','[::1]'].includes(location.hostname)&&new URLSearchParams(location.search).get('audio')==='local';
  const base=local?new URL('audio/',location.href).href:AUDIO_BASE;
  return base+u.replace(/^\/+/, '');
}
function auSec(v){ const s=Math.max(0,Math.round(Number(v)||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function auEnsure(){
  if(AU) return AU;
  AU=new Audio(); AU.preload='metadata';
  AU.addEventListener('timeupdate',auTick);
  AU.addEventListener('ended',()=>{
    const clip=audioClip;
    if(!clip||clip.state!=='playing'||AU.currentSrc!==clip.url) return;
    if(AU.currentTime>=clip.end-0.12) auFinish(clip); else auFail(clip);
  });
  AU.addEventListener('error',()=>{ if(audioClip&&AU.error) auFail(audioClip); });
  return AU;
}
function auHalt(){
  const clip=audioClip;
  audioClip=null;
  clearInterval(audioTimer);
  if(!AU) return;
  if(clip&&(clip.state==='starting'||clip.state==='playing')&&!AU.seeking){
    clip.cur.audioPosition=clamp(AU.currentTime-clip.start,0,clip.end-clip.start);
  }
  AU.pause();
}
function auPrepare(q,cur){
  if(audioClip&&audioClip.cur===cur) return audioClip;
  auHalt();
  const el=auEnsure();
  const url=new URL(auUrl(q.au.u),location.href).href;
  audioClip={cur,url,start:Number(q.au.s),end:Number(q.au.e),state:'ready'};
  if(el.src!==url) el.src=url;
  return audioClip;
}
function auFinish(clip){
  clearInterval(audioTimer);
  AU.pause();
  clip.state='ready';
  clip.cur.auDone=true;
  clip.cur.audioPosition=0;
  render();
}
function auFail(clip){
  if(audioClip!==clip||clip.state==='error') return;
  clearInterval(audioTimer);
  AU.pause();
  clip.state='error';
  toast('音声を再生できません。音源と接続を確認して、もう一度お試しください');
  render();
}
function auTick(){
  const clip=audioClip;
  if(!clip||clip.state!=='playing'||AU.seeking||AU.currentSrc!==clip.url) return;
  const duration=clip.end-clip.start;
  const elapsed=clamp(AU.currentTime-clip.start,0,duration);
  clip.cur.audioPosition=elapsed;
  if(AU.currentTime>=clip.end-0.04){ auFinish(clip); return; }
  const bar=document.getElementById('aubar-i'), tm=document.getElementById('aubar-t');
  if(bar) bar.style.width=Math.round(elapsed/duration*100)+'%';
  if(tm) tm.textContent=auSec(elapsed);
}
function auPlay(q,cur){
  if(!q||!q.au||!cur||auLocked(cur)) return;
  const clip=auPrepare(q,cur),el=AU;
  if(clip.state==='starting') return;
  if(clip.state==='playing'&&!el.paused){
    auTick();
    if(clip.state==='playing') clip.state='paused';
    clearInterval(audioTimer);
    el.pause(); render(); return;
  }
  if(!(clip.start>=0&&clip.end>clip.start&&Number.isFinite(clip.end))){ auFail(clip); return; }
  if(clip.state==='error') el.load();
  clearInterval(audioTimer);
  const elapsed=cur.audioPosition||0;
  clip.state='starting';
  try{
    // Seek before play() while the click still has browser audio permission.
    el.currentTime=clip.start+elapsed;
    el.play().then(()=>{
      if(audioClip!==clip||clip.state!=='starting') return;
      if(el.currentTime<clip.start-0.12) el.currentTime=clip.start+elapsed;
      clip.state='playing';
      audioTimer=setInterval(auTick,50);
      render(); auTick();
    }).catch(()=>auFail(clip));
    render();
  }catch(e){ auFail(clip); }
}
const audioAnswered=cur=>cur.submitted||cur.chosen!=null;
function auLocked(cur){ return String(S.conf.auOnce)!=='0'&&cur.auDone&&!audioAnswered(cur); }
function auHtml(q,cur){
  const clip=auPrepare(q,cur);
  const starting=clip.state==='starting';
  const playing=clip.state==='playing'&&!AU.paused;
  const locked=auLocked(cur);
  const elapsed=cur.audioPosition||0;
  const pausedMid=!playing&&(clip.state==='paused'||elapsed>0);
  const label=starting?'読み込み中…':(playing?'■ 一時停止':(pausedMid?'▶ 続きから':'▶ 音声を再生'));
  const note=locked?'最後まで流しました（本番は 1 回）'
    :(clip.state==='error'?'音声の読み込みに失敗しました。再試行できます。'
      :(pausedMid?'一時停止中。続きから再生できます':(audioAnswered(cur)||String(S.conf.auOnce)==='0'?'何回でも再生できます':'本番どおり 1 回')));
  const progress=locked?100:Math.round(100*clamp(elapsed/(clip.end-clip.start)||0,0,1));
  return '<div class="aubar">'+
    '<button class="aubtn'+(locked||starting?' off':'')+'" data-act="aplay"'+(locked||starting?' disabled':'')+'>'+label+'</button>'+
    '<div class="autrack"><i id="aubar-i" style="width:'+progress+'%"></i></div>'+
    '<span class="autime" id="aubar-t">'+auSec(locked?clip.end-clip.start:elapsed)+'</span>'+
    '<span class="aunote">'+note+'</span>'+
  '</div>';
}

/* ---------- 分析 ---------- */
function advice(a){
  if(!a.total) return [{t:'まず基準線をつくる',d:'N4 範囲で 10 問。正答率が数字になると、以降の配分を決められる。'}];
  const out=[];
  const cs=CATS.map(k=>({k,n:(a.cat[k]||{}).n||0,ok:(a.cat[k]||{}).ok||0,r:(a.cat[k]||{}).n?((a.cat[k].ok||0)/a.cat[k].n):0})).filter(x=>x.n>=2);
  cs.sort((x,y)=>x.r-y.r);
  const worst=cs[0];
  if(worst&&worst.r<0.75) out.push({t:worst.k+' が最も弱い（正答 '+Math.round(worst.r*100)+'%）',d:weakTip(worst.k)});
  if(a.due>15) out.push({t:'復習待ちが '+a.due+' 問たまっている',d:'今日は新規を止め、復習だけで回す。期日を過ぎた問題は忘れている前提で扱う。'});
  const cov=a.bank?a.seen/a.bank:0;
  if(cov<0.6) out.push({t:'題庫の '+Math.round(cov*100)+'% にしか触れていない',d:'分野を絞らず一巡する。偏った周回は弱点を見えなくする。'});
  if(a.acc>=0.85&&a.total>=30) out.push({t:'正答率は十分（'+Math.round(a.acc*100)+'%）',d:'N2 範囲の比率を上げ、読解は時間制限を入れて解く。'});
  const ds=daysLeft();
  const perWeek=Math.max(1,Math.round(a.bank*2/Math.max(1,ds/7)));
  out.push({t:'残り '+ds+' 日',d:'題庫を 2 周するなら 1 週あたり約 '+perWeek+' 問、1 日 '+(Math.max(3,Math.round(perWeek/7)))+' 問の計算。'});
  return out;
}

  const shown=progRows.slice(0,40);
  const dueTxt=ms=>{ if(!ms) return '—'; const dd=Math.floor((ms-Date.now())/DAY); return dd<0?'期日超過':(dd===0?'今日':'+'+dd+' 日'); };
  const tagRows=Object.keys(a.tag).map(k=>({k,...a.tag[k],r:a.tag[k].n?a.tag[k].ok/a.tag[k].n:0}))
    .filter(x=>x.n>=2).sort((x,y)=>y.ng-x.ng||x.r-y.r).slice(0,9);
  const lvRows=LVS.map(l=>{

function selConf(name,items,cur){

function exportProgCsv(){
  const rows=[['問題ID','レベル','分野','解答回数','正解','誤答','正答率','連続正解(ボックス)','最終解答','次回期日']];
  Object.keys(S.prog).forEach(id=>{
    const p=S.prog[id]; if(!p||!p.n) return;
    const q=qOf(id)||{};
    rows.push([id,q.lv||'',q.cat||'',p.n,p.ok||0,p.ng||0,
      (p.n?Math.round((p.ok||0)/p.n*100):0)+'%',p.box||0,
      p.last?dayKey(p.last):'',p.due?dayKey(p.due):'']);
  });
  const body=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  try{
    const blob=new Blob(['\uFEFF'+body],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='n2-exam-room-prog-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800);
    toast('解答記録を CSV で書き出しました（'+(rows.length-1)+' 問）');
  }catch(e){ toast('書き出しに失敗しました'); }
}

function normMaterials(list){
  if(list===undefined) return [];
  if(!Array.isArray(list)) throw new Error('materials は配列で指定してください');
  const ids=new Set();
  for(const m of list){
    if(!m||typeof m.id!=='string'||!m.id.trim()||ids.has(m.id)) throw new Error('資料の ID が空または重複しています');
    ids.add(m.id);
    if(m.type==='reading'){
      if(!Array.isArray(m.p)||!m.p.length||m.p.some(p=>typeof p!=='string'||!p.trim())){
        throw new Error(m.id+'：資料の本文がありません');
      }
      if(m.pt!==undefined&&(!Array.isArray(m.pt)||m.pt.length!==m.p.length||m.pt.some(t=>typeof t!=='string'))){
        throw new Error(m.id+'：pt の段落数が p と合いません');
      }
    }else if(m.type==='listening'){
      const au=m.au;
      if(!au||typeof au.u!=='string'||!au.u.trim()||!Number.isFinite(au.s)||!Number.isFinite(au.e)||au.s<0||au.e<=au.s){
        throw new Error(m.id+'：音声の区間が不正です');
      }
    }else throw new Error(m.id+'：資料の type が不正です');
  }
  return list;
}
function hasMaterial(q,materials){
  if(q.materialId===undefined) return false;
  const material=materials?.get(q.materialId);
  if(!material) throw new Error(q.id+'：資料が見つかりません — '+q.materialId);
  if((material.type==='listening')!==(q.cat==='聴解')) throw new Error(q.id+'：資料の種類が分野と合いません');
  return true;
}
function normQ(o,i,loose,materials){
  if(!o||typeof o!=='object'||Array.isArray(o)) throw new Error('オブジェクト形式で書いてください');
  const q=Object.assign({},o);
  q.id=String(q.id||('C'+Date.now().toString(36)+i));
  q.lv=q.lv||'N2';
  q.cat=q.cat||'文法';
  q.opts=Array.isArray(q.opts)?q.opts:[];
  q.notes=Array.isArray(q.notes)?q.notes:[];
  q.rd=Array.isArray(q.rd)?q.rd.filter(n=>n&&n.t):[];
  q.ex=Array.isArray(q.ex)?q.ex.filter(n=>n&&n.j):[];
  q.tags=(Array.isArray(q.tags)&&q.tags.length)?q.tags:[q.cat];
  q.q=q.q||'＿＿に入れるのに最もよいものを選んでください。';
  q.ans=Number(q.ans??0);
  if(!hasMaterial(q,materials)&&!q.b&&!q.p&&!(q.au&&q.au.u)) throw new Error('b（文）か p（本文の配列）か au（音声）が必要です');
  if(q.opts.length<2) throw new Error('opts は 2 つ以上必要です');
  if(!Number.isInteger(q.ans)||q.ans<0||q.ans>=q.opts.length) throw new Error('ans が opts の範囲外です');
  if(!loose && qOf(q.id)) q.id=q.id+'-'+Date.now().toString(36).slice(-3);
  return q;
}
function normBank(list,materials=[]){
  if(!Array.isArray(list)||!list.length) throw new Error('問題の配列を読み込んでください');
  const out=[], seen=new Set(), byId=new Map(materials.map(m=>[m.id,m]));
  list.forEach((o,i)=>{
    if(!o||typeof o!=='object'||Array.isArray(o)) throw new Error((i+1)+' 番目がオブジェクト形式ではありません');
    const q=Object.assign({},o);
    q.id=String(q.id||('B'+String(i+1).padStart(3,'0')));
    if(seen.has(q.id)) throw new Error('id が重複しています：'+q.id);
    seen.add(q.id);
    q.lv=q.lv||'N2';
    q.cat=q.cat||'文法';
    q.opts=Array.isArray(q.opts)?q.opts:[];
    q.notes=Array.isArray(q.notes)?q.notes:[];
    q.rd=Array.isArray(q.rd)?q.rd.filter(n=>n&&n.t):[];
    q.ex=Array.isArray(q.ex)?q.ex.filter(n=>n&&n.j):[];
    q.tags=(Array.isArray(q.tags)&&q.tags.length)?q.tags:[q.cat];
    q.q=q.q||'＿＿に入れるのに最もよいものを選んでください。';
    q.ans=Number(q.ans??0);
    if(!hasMaterial(q,byId)&&!q.b&&!q.p&&!(q.au&&q.au.u)) throw new Error(q.id+'：b（文）か p（本文の配列）か au（音声）が必要です');
    if(q.opts.length<2) throw new Error(q.id+'：opts は 2 つ以上必要です');
    if(!Number.isInteger(q.ans)||q.ans<0||q.ans>=q.opts.length) throw new Error(q.id+'：ans が opts の範囲外です');
    if(Array.isArray(q.p)&&Array.isArray(q.pt)&&q.pt.length!==q.p.length) throw new Error(q.id+'：pt の段落数が p と合いません');
    out.push(q);
  });
  return out;
}
/* 題庫：manifest（索引）＋ 冊子（{questions:[...]} / 配列 / {bank:[...]}） */
function slugName(n){ return String(n||'bank').replace(/\.json$/i,'').replace(/[^\w\-]+/g,'-').replace(/^-+|-+$/g,'')||'bank'; }
function parseBankDoc(fileName,data){
  if(data&&Array.isArray(data.banks)) return {manifest:data};
  const raw=Array.isArray(data)?data:(data?.questions||data?.bank);
  if(Array.isArray(raw)) return {book:{id:String(data.id||slugName(fileName)),name:String(data.name||fileName||'bank').replace(/\.json$/i,''),level:String(data.level||''),raw,materials:normMaterials(data.materials)}};
  throw new Error(String(fileName||'ファイル')+'：形式が不明です（manifest か {questions:[...]} か 配列）');
}
function normBookQ(list,bookName,materials){
  if(!Array.isArray(list)||!list.length) throw new Error(bookName+'：問題が 0 件です');
  const byId=new Map(materials.map(m=>[m.id,m]));
  return list.map((o,i)=>{
    if(!o||typeof o!=='object'||Array.isArray(o)) throw new Error(bookName+'：'+(i+1)+' 番目がオブジェクトではありません');
    try{ return normQ(o,i,true,byId); }
    catch(err){ throw new Error(bookName+'：'+(o.id||('#'+(i+1)))+' '+err.message); }
  });
}
function loadBankFiles(files,mode){
  const list=[].slice.call(files||[]);
  if(!list.length) return;
  Promise.all(list.map(f=>new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      let d=null,err='';
      try{ d=JSON.parse(String(r.result)); }catch(e){ err='JSON として読めません'; }
      res({name:f.name,data:d,err:err});
    };
    r.onerror=()=>res({name:f.name,data:null,err:'読み込みに失敗'});
    r.readAsText(f);
  }))).then(parts=>{
    try{
      const bad=parts.filter(p=>p.err);
      if(bad.length) throw new Error(bad.map(p=>p.name+'：'+p.err).join(' ／ '));
      let manifest=null; const books=[];
      parts.forEach(p=>{
        const doc=parseBankDoc(p.name,p.data);
        if(doc.manifest) manifest=doc.manifest;
        else books.push({...doc.book,file:p.name});
      });
      if(manifest&&Array.isArray(manifest.banks)&&manifest.banks.length){
        const order=manifest.banks.map(b=>String(b.file||b.id||''));
        books.sort((a,b)=>{
          const ai=order.indexOf(a.file), bi=order.indexOf(b.file);
          return (ai<0?999:ai)-(bi<0?999:bi);
        });
      }
      if(!books.length) throw new Error('冊子ファイルが見つかりません（索引だけでは問題を読めません）');
      const normalized=books.map(bk=>({
        id:bk.id, name:bk.name, level:bk.level, file:bk.file,materials:bk.materials,
        qs:normBookQ(bk.raw,bk.name||bk.id,bk.materials)
      }));
      let out;
      if(manifest||mode!=='append'){
        out=normalized;
      }else{
        out=baseBooks().map(b=>({id:b.id,name:b.name,level:b.level,file:b.file||'',qs:b.qs.slice(),materials:b.materials}));
        normalized.forEach(bk=>{
          const i=out.findIndex(b=>b.id===bk.id);
          if(i>=0) out[i]=bk; else out.push(bk);
        });
      }
      /* 冊子をまたぐ id の重複は、後から来たほうに接尾辞を付ける */
      const used={};
      out.forEach(bk=>{
        bk.qs=bk.qs.map(q=>{
          if(used[q.id]){
            const base=q.id; let n=2;
            while(used[base+'-'+n]) n++;
            q=Object.assign({},q,{id:base+'-'+n});
          }
          used[q.id]=1;
          return q;
        });
      });
      S.banks=out;
      save(); render();
      toast((manifest||mode!=='append'?'題庫を差し替えました：':'題庫に追加しました：')+out.length+' 冊 ／ '+allQ().length+' 問');
    }catch(err){ toast('題庫を読み込めません：'+err.message); }
  });
}
function bookJson(bk){
  return {id:bk.id,name:bk.name,level:bk.level,file:bk.file||'',updated:new Date().toISOString().slice(0,10),count:bk.qs.length,
    materials:bk.materials?.length?bk.materials:undefined,questions:bk.qs};
}
function exportBank(id){
  try{
    const bk=baseBooks().find(b=>b.id===id)||baseBooks()[0];
    const blob=new Blob([JSON.stringify(bookJson(bk),null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(bk.file&&/^[\w\-]+(?:\.[\w\-]+)?\.json$/.test(bk.file))?bk.file:(bk.id+'.json');
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
    toast((bk.name||bk.id)+' を書き出しました（'+bk.qs.length+' 問）');
  }catch(err){ toast('書き出しに失敗：'+err.message); }
}
function exportManifest(){
  try{
    const banks=baseBooks().map((b,i)=>({id:b.id,name:b.name,level:b.level,file:(b.file&&/^[\w\-]+(?:\.[\w\-]+)?\.json$/.test(b.file))?b.file:(b.id+'.json'),count:b.qs.length,order:i+1}));
    const blob=new Blob([JSON.stringify({version:1,updated:new Date().toISOString().slice(0,10),note:'主 HTML はこの索引を読み、banks の順に各ファイルを結合して出題します。',banks:banks},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='manifest.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
    toast('manifest.json を書き出しました（'+banks.length+' 冊）');
  }catch(err){ toast('書き出しに失敗：'+err.message); }
}
function stdBank(){
  if(!S.banks) { toast('すでに内蔵題庫です'); return; }
  S.banks=null;
  save(); render();
  toast('内蔵題庫に戻しました');
}
function addQ(){
  const ta=$('#newQ');
  if(!ta) return;
  const raw=ta.value.trim();
  if(!raw){ toast('JSON を貼ってください'); return; }
  try{
    const d=JSON.parse(raw);
    const arr=Array.isArray(d)?d:[d];
    const add=arr.map((o,i)=>normQ(o,i));
    S.custom=S.custom.concat(add);
    save(); render();
    toast(add.length+' 問を追加しました');
  }catch(err){ toast('追加できません：'+err.message); }
}
function importFile(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(String(r.result));
      let banks;
      if(Array.isArray(d.banks)&&d.banks.length){
        banks=d.banks.filter(b=>b&&Array.isArray(b.qs)).map(b=>{
          const materials=normMaterials(b.materials);
          return {id:String(b.id||'bank'),name:String(b.name||'題庫'),level:String(b.level||''),file:String(b.file||''),materials,qs:normBank(b.qs,materials)};
        });
      }
      if(Array.isArray(d.bank)&&d.bank.length) banks=[{id:'legacy',name:'読み込み題庫',level:'',qs:normBank(d.bank)}];
      if(Array.isArray(d.custom)) S.custom=d.custom.map((o,i)=>normQ(o,i));
      if(d.prog&&typeof d.prog==='object') S.prog=d.prog;
      if(d.conf){
        S.conf=Object.assign({},DEF_CONF,d.conf);
        if(!Array.isArray(S.conf.intervals)||!S.conf.intervals.length) S.conf.intervals=DEF_CONF.intervals.slice();
        S.conf.intervals=S.conf.intervals.slice(0,8).map(v=>Math.max(1,Math.round(Number(v)||1)));
      }
      if(Array.isArray(d.log)) S.log=d.log.concat(S.log).slice(-4000);
      if(banks) S.banks=banks;
      if(d.fav&&typeof d.fav==='object'){
        if(Array.isArray(d.fav.q)) d.fav.q.forEach(id=>{ if(typeof id==='string'&&!favq(id)) S.fav.q.push(id); });
        if(Array.isArray(d.fav.w)) d.fav.w.forEach(x=>{ if(x&&x.t&&favwIdx(x.t,x.qid)<0) S.fav.w.push({t:x.t,r:x.r||'',m:x.m||'',qid:x.qid||''}); });
        if(Array.isArray(d.fav.g)) d.fav.g.forEach(x=>{ if(x&&x.g&&favgIdx(x.g,x.qid)<0) S.fav.g.push({g:x.g,gm:x.gm||'',qid:x.qid||''}); });
      }
      save(); render();
      toast('読み取りました（追加問題 '+S.custom.length+' 問・栞 '+(S.fav.q.length+S.fav.w.length+S.fav.g.length)+' 件）');
    }catch(err){ toast('読み取りに失敗：'+err.message); }
  };
  r.readAsText(f);
}
function delQ(id){
  if(BANK.some(b=>b.id===id)){ toast('標準の問題は削除できません'); return; }
  S.custom=S.custom.filter(x=>x.id!==id);
  delete S.prog[id];
  S.fav.q=S.fav.q.filter(x=>x!==id);
  S.fav.w=S.fav.w.filter(x=>x.qid!==id);
  S.fav.g=S.fav.g.filter(x=>x.qid!==id);
  save(); render();
  toast('削除しました');
}
function resetAll(){
  if(!confirm('学習記録（正誤・期日・履歴）と、追加した問題をすべて消します。よろしいですか？')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S.custom=[]; S.prog={}; S.conf=Object.assign({},DEF_CONF); S.log=[]; S.banks=null;
  S.fav={q:[],w:[],g:[]};
  SS=null;
  save(); render();
  toast('記録を消しました');
}

/* ---------- ツールチップ ---------- */
function showTip(el){
  const t=$('#tip');
  const w=el.dataset.w||'';
  const r=el.dataset.r||'';
  const m=el.dataset.m||'';
  t.innerHTML=(r?'<div class="tip-r">'+esc(r)+'</div>':'')+
    '<div class="tip-m">'+esc(w)+'</div>'+
    (m?'<div class="tip-n">'+esc(m)+'</div>':'');
  t.hidden=false;
  const b=el.getBoundingClientRect();
  const tw=t.offsetWidth, th=t.offsetHeight;
  let left=b.left+b.width/2-tw/2;
  left=clamp(left,8,Math.max(8,innerWidth-tw-8));
  let top=b.top-th-8;
  if(top<8) top=b.bottom+10;
  t.style.left=Math.round(left)+'px';
  t.style.top=Math.round(top)+'px';
}
function hideTip(){ const t=$('#tip'); if(t) t.hidden=true; }

/* ---------- イベント ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const act=t.dataset.act;
  if(act==='quick'){
    startSession({lv:'all',cat:t.dataset.cat||'all',count:Number(t.dataset.count)||10,mode:t.dataset.mode||'auto'});
  }else if(act==='setcat'){
    setup.cat=t.dataset.v||'all'; render();
  }else if(act==='start'){
    if(practicePreview) startSession(practicePreview.cfg,practicePreview.units);
  }else if(act==='pick'){ answer(Number(t.dataset.i)); }
  else if(act==='group-question'){
    const unit=currentUnit(),index=Number(t.dataset.i);
    if(unit?.grouped&&Number.isInteger(index)&&unit.questions[index]){
      unit.questionIndex=index; unit.showPassage=false; render();
      $(`button[data-act="group-question"][data-i="${index}"]`)?.focus();
    }
  }
  else if(act==='group-passage'){
    const unit=currentUnit();
    if(unit?.grouped&&unit.material.type==='reading'){
      unit.showPassage=!unit.showPassage; render();
      $('[data-act="group-passage"]')?.focus();
    }
  }
  else if(act==='group-submit'){ submitGroup(); }
  else if(act==='next'){ nextQ(); }
  else if(act==='again'){ if(SS) startSession(SS.cfg); }
  else if(act==='practice-setup'){ auHalt(); SS=null; render(); window.scrollTo(0,0); }
  else if(act==='goto'){ location.hash='#/'+(t.dataset.to||'home'); }
  else if(act==='drill-single'){ if(t.dataset.id) startSession({ids:[t.dataset.id]}); }
  else if(act==='drill-material'){
    const group=questionMaterials().get(t.dataset.id);
    if(group) startSession({ids:group.questions.map(q=>q.id)});
  }
  else if(act==='drill-list'){
    const ids=(t.dataset.ids||'').split(',').filter(Boolean);
    if(ids.length) startSession({ids});
  }
  else if(act==='tr'){ if(SS&&SS.cur){ SS.cur.showTr=!showTranslation(SS.cur); render(); } }
  else if(act==='favq'){ e.preventDefault(); toggleFavQ(t.dataset.id); }
  else if(act==='favw'){ e.preventDefault(); toggleFavW(t.dataset.t,t.dataset.id,t.dataset.r,t.dataset.m); }
  else if(act==='favg'){ e.preventDefault(); toggleFavG(t.dataset.g,t.dataset.id,t.dataset.gm); }
  else if(act==='export'){ exportData(); }
  else if(act==='exportcsv'){ exportProgCsv(); }
  else if(act==='sync-new'){ syncNew(); }
  else if(act==='sync-push'){ syncPush(); }
  else if(act==='sync-pull'){ syncPull(); }
  else if(act==='sync-off'){ syncOff(); }
  else if(act==='sync-copy'){ syncCopy(); }
  else if(act==='sync-diag'){ syncDiag(); }
  else if(act==='autest'){
    const f=String(($('#aufile')||{}).value||'').trim();
    if(!f){ toast('ファイル名を入れてください'); return; }
    try{
      const a=new Audio(auUrl(f));
      a.play().then(()=>{ toast('再生中（8 秒で止めます）。音が出なければ URL と MIME を確認'); })
        .catch(()=>toast('再生できません。桶が public か、ファイル名と URL を確認してください'));
      setTimeout(()=>{ try{ a.pause(); }catch(e){} },8000);
    }catch(e){ toast('再生できません'); }
  }
  else if(act==='aplay'){
    const unit=currentUnit();
    if(unit) auPlay(audioSource(unit),unit.grouped?unit:SS.cur);
  }
  else if(act==='sync-join'){ syncJoin(($('#syc')||{}).value,($('#syk')||{}).value); }
  else if(act==='import'){ const f=$('#impFile'); if(f) f.click(); }
  else if(act==='exportbook'){ exportBank(t.dataset.id); }
  else if(act==='exportmanifest'){ exportManifest(); }
  else if(act==='loadbank'){ bankMode='replace'; const f=$('#bankFile'); if(f) f.click(); }
  else if(act==='loadbankadd'){ bankMode='append'; const f=$('#bankFile'); if(f) f.click(); }
  else if(act==='stdbank'){ stdBank(); }
  else if(act==='addq'){ addQ(); }
  else if(act==='delq'){ delQ(t.dataset.id); }
  else if(act==='tpl'){ const ta=$('#newQ'); if(ta) ta.value=TPL; toast('テンプレートを戻しました'); }
  else if(act==='reset'){ resetAll(); }
});

/* オンライン（http/https）のときは bank/ を毎回確認し、索引が変わっていたら読み直す */
(async function syncBanksFromServer(){
  if(!/^https?:/.test(location.protocol)){
    BANK_DIAG='ローカルファイル（file://）で開いているため、bank/ を読めません。フォルダで python3 tools/serve_local.py を実行し、表示された URL を開いてください。';
    render(); return;
  }
  try{
    const usesManualBooks=()=>S.banks&&S.banks.some(b=>b.src!=='server');
    if(usesManualBooks()){
      BANK_DIAG='手動で読み込んだ題庫を使用しています。自動更新を使うには内蔵題庫に戻してから再読み込みしてください。'; render(); return;
    }
    const base=new URL('.',location.href).href;
    const res=await fetch(base+'bank/manifest.json',{cache:'no-store'});
    if(!res.ok){ BANK_DIAG='manifest.json を取得できません（HTTP '+res.status+'）。bank/ が index.html と同じ場所にあるか確認してください。'; render(); return; }
    const m=await res.json();
    if(!m||!Array.isArray(m.banks)||!m.banks.length){ BANK_DIAG='manifest.json の形式が想定外です。'; render(); return; }
    const revision=String(m.revision||m.updated||m.version||'');
    const cur=Array.isArray(S.banks)?S.banks:[];
    const same=cur.length===m.banks.length&&cur.every((b,i)=>b.file===m.banks[i]?.file&&b.src==='server'&&b.rev===revision);
    if(same){ BANK_DIAG='サーバーの題庫 '+cur.length+' 冊（変更なし）。'; render(); return; }
    const entries=await Promise.all(m.banks.map(async b=>{
      const f=String((b&&b.file)||'');
      if(!/^[A-Za-z0-9._-]+\.json$/.test(f)) return {error:f+'（名前が不正）'};
      try{
        const r2=await fetch(base+'bank/'+f,{cache:'no-store'});
        if(!r2.ok) return {error:f+'（HTTP '+r2.status+'）'};
        const {book}=parseBankDoc(f,await r2.json());
        const qs=normBank(book.raw,book.materials);
        if(Number.isInteger(b.count)&&b.count!==qs.length) return {error:f+'（問題数が索引と異なる）'};
        return {id:String(b.id||book.id),name:String(b.name||book.name),level:String(b.level||book.level),file:f,src:'server',rev:revision,qs,materials:book.materials};
      }catch(e){ console.warn('[bank]',f,e); return {error:f+'（'+(e&&e.message?e.message:'読めません')+'）'}; }
    }));
    const failures=entries.filter(b=>b.error).map(b=>b.error);
    if(failures.length){ BANK_DIAG='題庫を更新できません：'+failures.join(' / '); render(); return; }
    const ids=entries.flatMap(b=>b.qs.map(q=>q.id));
    if(new Set(ids).size!==ids.length){ BANK_DIAG='題庫を更新できません：冊子間で問題 ID が重複しています。'; render(); return; }
    if(usesManualBooks()) return;
    S.banks=entries; save();
    BANK_DIAG='サーバーの題庫 '+entries.length+' 冊 ／ '+allQ().length+' 問。';
    render();
  }catch(e){
    BANK_DIAG='題庫の取得に失敗：'+(e&&e.message?e.message:e);
    console.warn('[bank] sync',e); render();
  }
})();
